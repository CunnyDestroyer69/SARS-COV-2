<title>Star vs. the Forces of Fluff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An unofficial Star vs. the Forces of Evil fan game: a tag-team platformer starring Star and Marco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one letterboxed 16:9 game canvas floating in the purple space between dimensions.
   Single dark visual world by choice (the game paints its own scenes). */
:root {
  --void: #1b1030;
  --void-2: #2c174d;
  --rim: #3d2566;
  --ink: #f6eefe;
  --star: #ffd84a;
  --display: "Gluten", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--void); }
body {
  height: 100%;
  margin: 0;
  box-sizing: border-box;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, var(--void-2), var(--void) 72%) var(--void);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
#wrap { width: 100%; height: 100%; display: grid; place-items: center; }
#game {
  display: block;
  border-radius: 10px;
  background: #120a22;
  box-shadow: 0 0 0 2px var(--rim), 0 20px 60px rgba(0, 0, 0, .5);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
#game:focus-visible { box-shadow: 0 0 0 3px var(--star), 0 20px 60px rgba(0, 0, 0, .5); }
</style>
<main id="wrap">
  <canvas id="game" tabindex="0" aria-label="Star vs. the Forces of Fluff, a platform game. Arrow keys or A and D move, Space jumps, X attacks, C swaps between Star and Marco, V uses a super move, Escape pauses."></canvas>
</main>

    for (let i = 0; i < 9; i++) {
      const x = ((hash(i, 3) * 1400 - camX * 0.55 + t * 12 * (i % 3 + 1)) % 1100 + 1100) % 1100 - 70;
      const y = 60 + hash(i, 8) * 320 + Math.sin(t + i) * 12;
      c.save(); c.translate(x, y); c.rotate(Math.sin(t * 0.7 + i) * 0.5);
      const sc = ['#ff8fab', '#ffd166', '#8ce99a', '#b197fc', '#74c0fc'][i % 5];
      c.fillStyle = sc; rrect(c, -7, -22, 14, 26, 5); c.fill(); rrect(c, -7, -2, 22, 12, 6); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillRect(-7, -18, 14, 3);
      c.restore();
    }
  } else if (theme === 'void') {
    for (let i = 0; i < 60; i++) { const sx = hash(i, 2) * W, sy = hash(i, 6) * H; c.globalAlpha = 0.3 + Math.sin(t * 2 + i) * 0.3; circle(c, sx, sy, hash(i, 1) * 1.6 + 0.4, '#e9dcff'); }
    c.globalAlpha = 1;
    c.save(); c.translate(W / 2, H * 0.45); c.rotate(t * 0.05);
    for (let k = 0; k < 4; k++) {
      c.strokeStyle = `rgba(${[200, 140, 255, 180][k]},${[140, 110, 180, 90][k]},255,0.25)`; c.lineWidth = 3;
      c.beginPath();
      for (let a = 0; a < 14; a += 0.15) { const rr = a * 22 + k * 10; const px = Math.cos(a + k * 1.57) * rr, py = Math.sin(a + k * 1.57) * rr * 0.6; a ? c.lineTo(px, py) : c.moveTo(px, py); }
      c.stroke();
    }
    c.restore();
    for (let i = 0; i < 7; i++) {
      const x = (hash(i, 5) * W + t * 10 * (i % 2 ? 1 : -1) + W) % W, y = 60 + hash(i, 7) * 300 + Math.sin(t + i) * 20;
      c.save(); c.translate(x, y); c.rotate(t * 0.3 + i);
      buttonEye(c, 0, 0, 10 + hash(i, 1) * 10, ['#ef5a6f', '#45c4d6', '#ffd166', '#b197fc'][i % 4]);
      c.restore();
    }
  }
}
// ============================================================
//  levels: built with a tiny stamping API (tile coords)
//  tiles:  # ground  X wall  = one-way  B lint block  D gate
//          ^ v needles  * jelly bounce  ~ soapy water  c crumble cloud
//  things: @ start  E portal  K checkpoint  o sparkle  H nachos  P pudding
//          R rune  b bunny  m moth  s spider  k knight  t turret  g ghost  L boss
// ============================================================
const TILE_CHARS = '#X=BD^v*~c';
function makeLevel(def) {
  const g = Array.from({ length: def.h }, () => Array(def.w).fill(' '));
  const ents = [];
  const L = {
    fill(x0, y0, x1, y1, ch = '#') {
      for (let y = Math.max(0, y0); y <= Math.min(def.h - 1, y1); y++)
        for (let x = Math.max(0, x0); x <= Math.min(def.w - 1, x1); x++) g[y][x] = ch;
    },
    ground(x0, x1, top, ch = '#') { this.fill(x0, top, x1, def.h - 1, ch); },
    plat(x0, x1, y) { this.fill(x0, y, x1, y, '='); },
    put(x, y, ch) { if (TILE_CHARS.includes(ch)) { if (y >= 0 && y < def.h && x >= 0 && x < def.w) g[y][x] = ch; } else ents.push({ type: ch, x, y }); },
    row(x, y, str) { for (let i = 0; i < str.length; i++) if (str[i] !== ' ') this.put(x + i, y, str[i]); },
    sign(x, y, text) { ents.push({ type: '!', x, y, text }); },
    mover(x, y, axis, range, period = 3, phase = 0) { ents.push({ type: 'mover', x, y, axis, range, period, phase }); }
  };
  def.build(L);
  return Object.assign({}, def, { grid: g, ents });
}

let G = null;

function buildWorld(index) {
  const L = LEVELS[index];
  const grid = L.grid.map(r => r.slice());
  const w = {
    index, def: L, theme: L.theme, w: L.w, h: L.h, grid,
    player: null, enemies: [], projs: [], eprojs: [], pickups: [], parts: [], texts: [], movers: [],
    runes: [], gates: [], checks: [], signs: [], exit: null, boss: null, supers: [], shocks: [], warns: [],
    crumbles: new Map(), breaking: [], breakSet: new Set(),
    cam: { x: 0, y: 0, shake: 0 }, time: 0, flash: 0, banner: 3, state: 'play', stateT: 0,
    stats: { sparkles: 0, total: 0, pudding: false, hasPudding: false, kos: 0, hurt: 0 },
    spawn: null, activeSign: null, sparkCombo: 0, sparkComboT: 0, tiny: null, bossDoneT: 0
  };
  G = w;
  for (const e of L.ents) {
    const px = e.x * TS, py = e.y * TS;
    switch (e.type) {
      case '@': w.player = newPlayer(px + 6, py + TS - 42); break;
      case 'E': w.exit = { x: px + 16, y: py + 32 - 46, w: 40, h: 76 }; break;
      case 'K': w.checks.push({ x: px + 16, y: py + 32, on: false }); break;
      case 'o': w.pickups.push({ kind: 'spark', x: px + 16, y: py + 16, by: py + 16, t: Math.random() * 6 }); w.stats.total++; break;
      case 'H': w.pickups.push({ kind: 'nachos', x: px + 16, y: py + 20, by: py + 20, t: 0 }); break;
      case 'P': w.pickups.push({ kind: 'pudding', x: px + 16, y: py + 14, by: py + 14, t: 0 }); w.stats.hasPudding = true; break;
      case 'R': w.runes.push({ x: px + 16, y: py + 16, on: false, gates: [] }); break;
      case '!': w.signs.push({ x: px + 16, y: py + 32, text: e.text }); break;
      case 'mover': {
        const m = { x: px, y: py, bx: px, by: py, w: TS * 3, h: 12, axis: e.axis, range: e.range * TS, period: e.period, phase: e.phase, dx: 0, dy: 0, prevY: py, prevX: px };
        w.movers.push(m); break;
      }
      case 'L': w.boss = newBoss(px + 16, py); break;
      default: { const en = newEnemy(e.type, px, py); if (en) w.enemies.push(en); }
    }
  }
  // gates belong to their nearest rune

  for (const pt of clicks) {
    const pb = mapPlayRect();
    if (pt.x > pb.x && pt.x < pb.x + pb.w && pt.y > pb.y && pt.y < pb.y + pb.h) { sfx('confirm'); startLevel(Game.mapSel, true); return; }
    const bk = { x: 24, y: 20, w: 100, h: 34 };
    if (pt.x > bk.x && pt.x < bk.x + bk.w && pt.y > bk.y && pt.y < bk.y + bk.h) { go('title'); return; }
    MAP_NODES.forEach(([x, y], i) => { if (i <= max && dist(pt.x, pt.y, x, y) < 50) { if (Game.mapSel === i) { sfx('confirm'); startLevel(i, true); } else { Game.mapSel = i; sfx('select'); } } });
  }
  if (Game.screen !== 'map') return;
  if (confirmPressed()) { sfx('confirm'); startLevel(Game.mapSel, true); return; }

}
function mapPlayRect() { return { x: 720, y: 444, w: 196, h: 54 }; }
function drawMap(c) {
  const t = Game.t;
  drawBackground(c, 'void', t * 8, 0, t);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = font(38, 800, FONT_D); outlineText(c, 'Dimension Map', 146, 54, '#ffe15c', '#2a1640', 9);
  c.fillStyle = 'rgba(27,16,48,0.8)'; rrect(c, 24, 20, 100, 34, 17); c.fill();

    c.font = font(15, 800); c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    outlineText(c, open ? LEVELS[i].name : '???', x, y + 70, open ? '#ffffff' : '#8f82a8', '#1b1030', 5);
    if (best) { c.font = font(13, 700); outlineText(c, 'Rank ' + best.rank + (best.pudding ? '  · pudding ✓' : ''), x, y + 88, '#ffe066', '#1b1030', 4); }
  });
  const [sx, sy] = MAP_NODES[Game.mapSel];

  drawMarco(c, sx + 52, sy + 40, -1, { state: 'idle' }, t);
  // info panel

  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = font(24, 800, FONT_D); c.fillStyle = '#ffe15c'; c.fillText(L.name, 64, 464);
  c.font = font(15, 600); c.fillStyle = '#d9ccff'; c.fillText(L.sub, 64, 490);
  c.font = font(15, 700); c.fillStyle = '#ffffff';
  const info = best ? (L.boss ? `Best: rank ${best.rank} (${RANKS[best.rank]}) · ${fmtTime(best.time)}` : `Best: ${best.sparkles}/${best.total} sparkles · ${best.pudding ? 'pudding found' : 'pudding still hidden'} · rank ${best.rank}`) : 'Not cleared yet';
  c.fillText(info, 330, 478);
  const pb = mapPlayRect();
  c.fillStyle = '#ffe066'; rrect(c, pb.x, pb.y, pb.w, pb.h, 27); c.fill();
  c.font = font(20, 800, FONT_D); c.fillStyle = '#2a1640'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('Jump in!', pb.x + pb.w / 2, pb.y + pb.h / 2 + 2);
}

// ---------- play
function startLevel(i, withDialog) {
  Game.levelIndex = i;
  const L = LEVELS[i];
  const begin = () => { buildWorld(i); Game.screen = 'play'; Game.paused = false; Game.koMenu = false; Game.fadeIn = 1; playSong(THEMES[L.theme].song); };
  if (withDialog && L.dialog) { playSong(i === 0 ? 'title' : THEMES[L.theme].song); showDialog(L.dialog, i === 0 ? 'echo' : L.theme, begin); }
  else begin();
}
function retryFromCheckpoint() {
  Game.koMenu = false;
  if (G.def.boss) { startLevel(G.index, false); return; }
  const p = G.player;
  const np = newPlayer(G.spawn.x, G.spawn.y);
  np.hero = p.hero; np.meter = p.meter; np.inv = 2; np.safe = { x: G.spawn.x, y: G.spawn.y };
  G.player = np; G.state = 'play'; G.stateT = 0; G.eprojs.length = 0;
  playSong(THEMES[G.theme].song);
  updateCamera(0, true);
}
function pauseItems() {
  return [
    { label: 'Resume', act: () => { Game.paused = false; } },
    { label: 'Restart dimension', act: () => startLevel(G.index, false) },
    { label: 'Dimension map', act: () => { Game.paused = false; Game.mapSel = G.index; go('map'); } },
    { label: 'Music: ' + (Save.data.music ? 'on' : 'off'), act: () => setMusic(!Save.data.music) },
    { label: 'Sound effects: ' + (Save.data.sfx ? 'on' : 'off'), act: () => setSfx(!Save.data.sfx) }

}
function koItems() {

    { label: G.def.boss ? 'Try the fight again' : 'Try again from checkpoint', act: retryFromCheckpoint },

}
function updatePlay(dt) {
  if (Game.paused) {

    return;
  }
  if (Game.koMenu) {
    const it = koItems(); runMenu(it, layoutMenu(it, W / 2 - 170, 300, 340, 46, 12), 'koSel');
    if (Game.screen === 'play' && Game.koMenu) updateWorld(dt);
    return;
  }
  if (pressed.pause && G.state === 'play') { Game.paused = true; Game.pauseSel = 0; sfx('select'); return; }
  updateWorld(dt);
  if (G.state === 'won') { G.state = 'done'; onLevelComplete(); }
}
function drawPlay(c) {
  renderWorld(c);
  drawHUD(c);
  if (Game.paused) {
    c.fillStyle = 'rgba(15,8,30,0.7)'; c.fillRect(0, 0, W, H);
    c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.font = font(48, 800, FONT_D); outlineText(c, 'Paused', W / 2, 160, '#ffe15c', '#2a1640', 10);
    const it = pauseItems(); drawMenu(c, it, layoutMenu(it, W / 2 - 160, 196, 320, 42, 10), Game.pauseSel, { size: 19 });
  }
  if (Game.koMenu) {
    c.fillStyle = 'rgba(15,8,30,0.66)'; c.fillRect(0, 0, W, H);
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = font(56, 800, FONT_D); outlineText(c, 'Knocked out!', W / 2, 190, '#ff8fab', '#2a1640', 11);
    c.font = font(19, 600); c.fillStyle = '#ffffff';
    c.fillText(choice2(['Star sees stars. Marco sees... also stars.', 'Even the Butterfly family has off days.', 'Glossaryck says: try eating some pudding first.'], G.index), W / 2, 240);
    const it = koItems(); drawMenu(c, it, layoutMenu(it, W / 2 - 170, 300, 340, 46, 12), Game.koSel, { size: 19 });
  }
}
function choice2(arr, i) { return arr[i % arr.length]; }

function onLevelComplete() {
  const i = G.index, st = G.stats;
  const pct = st.total ? st.sparkles / st.total : 1;
  let rank = pct >= 0.9 && (st.pudding || !st.hasPudding) ? 'S' : pct >= 0.7 ? 'A' : pct >= 0.4 ? 'B' : 'C';
  if (G.def.boss) rank = st.hurt <= 2 ? 'S' : st.hurt <= 5 ? 'A' : st.hurt <= 9 ? 'B' : 'C';
  const res = { i, sparkles: st.sparkles, total: st.total, pudding: st.pudding, hasPudding: st.hasPudding, kos: st.kos, time: G.time, hurt: st.hurt, rank, boss: !!G.def.boss };
  const prev = Save.data.best[i];
  Save.data.best[i] = prev ? {
    sparkles: Math.max(prev.sparkles, res.sparkles), total: res.total, pudding: prev.pudding || res.pudding,
    rank: RANK_VAL[res.rank] > RANK_VAL[prev.rank] ? res.rank : prev.rank, time: Math.min(prev.time, res.time)
  } : { sparkles: res.sparkles, total: res.total, pudding: res.pudding, rank: res.rank, time: res.time };
  Save.data.unlocked = Math.max(Save.data.unlocked, Math.min(LEVELS.length, i + 2));
  if (G.def.boss) Save.data.finished = true;
  Save.store();
  Game.clear = res; Game.clearSel = 0; Game.screen = 'clear'; Game.fadeIn = 0.6;
  sfx('win'); playSong('title');
}
function clearItems() {
  const r = Game.clear;
  if (r.boss) return [{ label: 'See the ending', act: () => showDialog('ending', 'void', () => go('credits')) }];
  return [
    { label: 'Next dimension', act: () => startLevel(r.i + 1, true) },
    { label: 'Replay this one', act: () => startLevel(r.i, false) },
    { label: 'Dimension map', act: () => { Game.mapSel = Math.min(r.i + 1, LEVELS.length - 1); go('map'); } }
  ];
}
function updateClear(dt) { if (G) { G.time += 0; updateParticles(dt); } const it = clearItems(); runMenu(it, layoutMenu(it, W / 2 - 150, 380, 300, 40, 8), 'clearSel'); }
function drawClear(c) {
  const r = Game.clear, t = Game.t;

  rows.forEach(([a, b], i) => {
    c.font = font(19, 700); c.textAlign = 'left'; c.fillStyle = '#ffffff'; c.fillText(a, 240, 176 + i * 34);
    c.textAlign = 'right'; c.fillStyle = (a === 'Pudding cup' && !r.pudding) ? '#8f82a8' : '#fff6b0'; c.fillText(b, 520, 176 + i * 34);
  });
  // rank badge
  const bx = 640, by = 222;
  c.save(); c.translate(bx, by); c.rotate(Math.sin(t * 2) * 0.06);
  starPath(c, 0, 0, 72, 40, 5); c.fillStyle = '#ffe066'; c.fill(); c.strokeStyle = '#2a1640'; c.lineWidth = 5; c.stroke();
  c.font = font(54, 800, FONT_D); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#2a1640'; c.fillText(r.rank, 0, 6);
  c.restore();
  c.font = font(16, 800); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = '#ffffff'; c.fillText(RANKS[r.rank] + ' rank', bx, by + 98);
  const it = clearItems(); drawMenu(c, it, layoutMenu(it, W / 2 - 150, 380, 300, 40, 8), Game.clearSel, { size: 18, center: true });
}

// ---------- credits
function updateCredits() { playSong('title'); if (Game.t - (Game.creditsT || 0) > 1.2 && (confirmPressed() || backPressed() || clicks.length)) { sfx('confirm'); go('title'); } }
function drawCredits(c) {
  const t = Game.t;
  drawBackground(c, 'echo', t * 25, 0, t);
  drawGroundStrip(c, 'echo', 470, t * 25);
  drawStar(c, 420, 470, 1, { state: 'idle' }, t);

  c.textAlign = 'center'; c.textBaseline = 'alphabetic';

  c.font = font(15, 600); c.fillStyle = '#ffffff';
  c.fillText('Story, levels, art and music made in code for this fan game.', W / 2, 292);
  c.fillText('Star vs. the Forces of Evil belongs to Disney. Unofficial and not affiliated.', W / 2, 316);

// ------------------------------------------------------------ main loop
function update(dt) {
  Game.t += dt;
  Game.fadeIn = Math.max(0, Game.fadeIn - dt * 3);
  if (pressed.music) setMusic(!Save.data.music);
  switch (Game.screen) {
    case 'title': updateTitle(dt); break;
    case 'howto': updateHowto(dt); break;
    case 'map': updateMap(dt); break;
    case 'dialog': updateDialog(dt); break;
    case 'play': updatePlay(dt); break;
    case 'clear': updateClear(dt); break;
    case 'credits': if (!Game.creditsT || Game.creditsT > Game.t) Game.creditsT = Game.t; updateCredits(dt); break;
  }
  if (Game.screen !== 'credits') Game.creditsT = 0;
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.textBaseline = 'alphabetic';
  switch (Game.screen) {
    case 'boot': ctx.fillStyle = '#1b1030'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#ffe066'; ctx.font = font(22, 700); ctx.textAlign = 'center'; ctx.fillText('Snipping open a portal...', W / 2, H / 2); break;
    case 'title': drawTitle(ctx); break;
    case 'howto': drawHowto(ctx); break;
    case 'map': drawMap(ctx); break;
    case 'dialog': drawDialog(ctx); break;
    case 'play': drawPlay(ctx); break;
    case 'clear': drawClear(ctx); break;
    case 'credits': drawCredits(ctx); break;
  }
  if (Game.fadeIn > 0) { ctx.fillStyle = `rgba(15,8,30,${Game.fadeIn})`; ctx.fillRect(0, 0, W, H); }
}
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 6 && !window.__fluffFreeze) {
    try { update(STEP); } catch (err) { console.error(err); }
    clearPressed(); acc -= STEP; steps++;
  }
  if (steps >= 6) acc = 0;
  try { render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && Game.screen === 'play' && G && G.state === 'play' && !Game.koMenu) Game.paused = true;
});

// ------------------------------------------------------------ boot
function boot(data) {
  Save.load();
  resize();
  try {
    if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
      window.claude.hot.snapshot(() => ({ level: Game.screen === 'play' && G ? G.index : null, screen: Game.screen }));
    }
  } catch (_) { }
  const fontsReady = (document.fonts && document.fonts.load)
    ? Promise.race([Promise.all([document.fonts.load('800 40px "Gluten"'), document.fonts.load('700 20px "Baloo 2"'), document.fonts.load('600 20px "Baloo 2"')]), new Promise(r => setTimeout(r, 2500))])
    : Promise.resolve();
  requestAnimationFrame(frame);
  fontsReady.catch(() => { }).then(() => {
    wrapCache.clear();
    if (data && typeof data.level === 'number' && LEVELS[data.level]) startLevel(data.level, false);
    else { Game.screen = 'title'; Game.fadeIn = 1; }
  });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});
window.__fluff = { Game, get G() { return G; }, held, pressed, LEVELS, startLevel, step(n) { for (let i = 0; i < n; i++) { update(STEP); clearPressed(); } }, tAt: (x, y) => tAt(x, y) };
})();
