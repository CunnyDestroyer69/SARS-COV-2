<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NIGHTJAR Intelligence OS</title>
<meta name="description" content="Fictional government intelligence OS built as a touchscreen movie prop for iPad.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIGHTJAR">
<meta name="theme-color" content="#03070b">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one fixed screen like a real OS. Classification banner + system bar on top, desktop
   (icons left, live widgets right, windows above) in the middle, taskbar at the bottom.
   Single committed dark look: a government terminal never follows the viewer's theme. */
:root {
  color-scheme: dark;
  --bg: #03070b;
  --bg-2: #06101a;
  --panel: #07131d;
  --panel-2: #0a1b28;
  --ink: #d3ebf6;
  --ink-dim: #7f9db1;
  --ink-faint: #4a6679;
  --acc-rgb: 54, 212, 255;
  --acc2-rgb: 160, 235, 255;
  --acc: rgb(var(--acc-rgb));
  --acc-2: rgb(var(--acc2-rgb));
  --line: rgba(var(--acc-rgb), .24);
  --line-2: rgba(var(--acc-rgb), .55);
  --fill: rgba(var(--acc-rgb), .07);
  --fill-2: rgba(var(--acc-rgb), .16);
  --warn-rgb: 255, 176, 58;
  --warn: rgb(var(--warn-rgb));
  --alert-rgb: 255, 72, 72;
  --alert: rgb(var(--alert-rgb));
  --ok-rgb: 70, 240, 166;
  --ok: rgb(var(--ok-rgb));
  --class-bar: #f2a516;
  --class-ink: #140c00;
  --f-ui: 'Rajdhani', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-data: 'Share Tech Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --f-doc: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --top-h: 58px;
  --task-h: 50px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body {
  font: 500 14px/1.35 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
  -webkit-text-size-adjust: 100%;
}
input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; border-radius: 0; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }
canvas { display: block; }
svg { display: block; }
.mono { font-family: var(--f-data); letter-spacing: .02em; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
.acc { color: var(--acc); }
.warn { color: var(--warn); }
.alert { color: var(--alert); }
.ok { color: var(--ok); }
.up { text-transform: uppercase; letter-spacing: .12em; }

#app { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
.screen { position: absolute; inset: 0; }

/* ---------- shared HUD pieces ---------- */
.brk {
  --bc: var(--line-2);
  --bl: 9px;
  background:
    linear-gradient(var(--bc) 0 0) top left / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc) 0 0) top left / 1px var(--bl) no-repeat,
    linear-gradient(var(--bc) 0 0) top right / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc) 0 0) top right / 1px var(--bl) no-repeat,
    linear-gradient(var(--bc) 0 0) bottom left / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc) 0 0) bottom left / 1px var(--bl) no-repeat,
    linear-gradient(var(--bc) 0 0) bottom right / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc) 0 0) bottom right / 1px var(--bl) no-repeat;
}
.panel { position: relative; border: 1px solid var(--line); background: rgba(6, 18, 28, .72); }
.panel-h {
  display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 0 10px;
  border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--fill-2), transparent 70%);
  font: 700 12px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--acc-2);
}
.panel-h .sp { flex: 1; }
.panel-h .mono { font-weight: 400; letter-spacing: .06em; color: var(--ink-dim); font-size: 11px; }
.panel-h::before { content: ''; width: 6px; height: 6px; background: var(--acc); flex: none; }

.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 34px; padding: 0 14px; border: 1px solid var(--line-2); background: var(--fill);
  font: 700 13px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acc-2);
  transition: background .15s, color .15s, border-color .15s;
}
.btn::after { content: ''; position: absolute; right: -1px; bottom: -1px; width: 7px; height: 7px; background: linear-gradient(135deg, transparent 50%, var(--acc) 50%); }
.btn:active, .btn.on { background: var(--acc); color: var(--bg); }
.btn.on::after { background: linear-gradient(135deg, transparent 50%, var(--bg) 50%); }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; letter-spacing: .12em; }
.btn.lg { min-height: 44px; padding: 0 20px; font-size: 15px; }
.btn.warn { border-color: rgba(var(--warn-rgb), .7); color: var(--warn); background: rgba(var(--warn-rgb), .08); }
.btn.warn::after { background: linear-gradient(135deg, transparent 50%, var(--warn) 50%); }
.btn.warn:active { background: var(--warn); color: var(--bg); }
.btn.alert { border-color: rgba(var(--alert-rgb), .75); color: #ffb3b3; background: rgba(var(--alert-rgb), .1); }
.btn.alert::after { background: linear-gradient(135deg, transparent 50%, var(--alert) 50%); }
.btn.alert:active { background: var(--alert); color: #1a0000; }
.btn[disabled] { opacity: .4; pointer-events: none; }

.seg { display: inline-flex; border: 1px solid var(--line-2); }
.seg > button { min-height: 28px; padding: 0 11px; font: 700 12px/1 var(--f-ui); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-dim); border-right: 1px solid var(--line); }
.seg > button:last-child { border-right: 0; }
.seg > button.on { background: var(--fill-2); color: var(--acc-2); box-shadow: inset 0 -2px 0 var(--acc); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; touch-action: pan-x; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > button { flex: none; padding: 9px 14px 8px; font: 700 12.5px/1 var(--f-ui); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-dim); border: 1px solid transparent; border-bottom: 0; }
.tabs > button.on { color: var(--acc-2); border-color: var(--line); background: var(--fill); box-shadow: inset 0 2px 0 var(--acc); }

.tag {
  display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px;
  border: 1px solid currentColor; font: 700 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
}
.tag::before { content: ''; width: 6px; height: 6px; background: currentColor; }
.tag.t-red { color: var(--alert); background: rgba(var(--alert-rgb), .1); }
.tag.t-amb { color: var(--warn); background: rgba(var(--warn-rgb), .08); }
.tag.t-acc { color: var(--acc); background: var(--fill); }
.tag.t-ok { color: var(--ok); background: rgba(var(--ok-rgb), .08); }
.tag.t-dim { color: var(--ink-dim); }
.tag.blink::before { animation: blink 1s steps(2) infinite; }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; align-items: baseline; }
.kv > dt { font: 600 11.5px/1.2 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.kv > dd { margin: 0; font: 400 13.5px/1.3 var(--f-data); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }

.meter { position: relative; height: 6px; background: rgba(var(--acc-rgb), .1); overflow: hidden; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--acc); }
.meter.seg-m { background: repeating-linear-gradient(90deg, rgba(var(--acc-rgb), .12) 0 5px, transparent 5px 7px); }
.meter.seg-m > i { background: repeating-linear-gradient(90deg, var(--acc) 0 5px, transparent 5px 7px); }

.scroll { overflow: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.scroll::-webkit-scrollbar { width: 4px; height: 4px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-2); }

.redact { display: inline; background: var(--ink); color: transparent; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 2px; }
.redact.tap { cursor: pointer; }
.redact.open { background: rgba(var(--warn-rgb), .18); color: var(--warn); }

.field-in {
  width: 100%; min-height: 38px; padding: 0 12px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .35);
  color: var(--ink); font: 400 15px/1 var(--f-data); letter-spacing: .06em; border-radius: 0; outline: none; -webkit-appearance: none; appearance: none;
}
.field-in:focus { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.field-in::placeholder { color: var(--ink-faint); }

@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes sweepx { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- top bar ---------- */
#topbar { position: absolute; inset: 0 0 auto 0; height: var(--top-h); z-index: 40; }
.classbar {
  height: 20px; display: flex; align-items: center; justify-content: center; gap: 18px; background: var(--class-bar); color: var(--class-ink);
  font: 700 12px/1 var(--f-ui); letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; overflow: hidden;
}
.classbar .cb-side { font-size: 10px; letter-spacing: .2em; opacity: .7; }
.sysbar {
  height: 38px; display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #071621, #050d14);
}
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-right: 1px solid var(--line); flex: none; }
.sb-brand svg { width: 24px; height: 24px; }
.sb-brand b { font: 700 17px/1 var(--f-ui); letter-spacing: .32em; color: var(--acc-2); }
.sb-brand small { font: 400 11px/1 var(--f-data); color: var(--ink-dim); letter-spacing: .06em; }
.sb-clocks { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; min-width: 0; overflow: hidden; }
.sb-clock { padding: 0 14px; border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sb-clock:first-child { border-left: 0; }
.sb-clock span { font: 700 9.5px/1 var(--f-ui); letter-spacing: .22em; color: var(--ink-faint); }
.sb-clock b { font: 400 14px/1 var(--f-data); color: var(--ink); font-variant-numeric: tabular-nums; }
.sb-clock.main b { color: var(--acc-2); }
.sb-right { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-left: 1px solid var(--line); flex: none; }
.sb-ind { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.sb-ind span { font: 700 9.5px/1 var(--f-ui); letter-spacing: .2em; color: var(--ink-faint); }
.sb-ind b { font: 400 12px/1 var(--f-data); color: var(--ink); white-space: nowrap; }
.sb-ind b.ok { color: var(--ok); }
.alvl { display: flex; gap: 2px; }
.alvl i { width: 7px; height: 12px; background: rgba(var(--acc-rgb), .15); }
.alvl i.on { background: var(--warn); }
.alvl i.on.hot { background: var(--alert); }
.sb-op { font: 600 12px/1.1 var(--f-ui); letter-spacing: .14em; text-align: right; color: var(--ink-dim); }
.sb-op b { display: block; color: var(--ink); font-size: 13px; }

/* ---------- desktop ---------- */
#desktop { position: absolute; left: 0; right: 0; top: var(--top-h); bottom: var(--task-h); overflow: hidden; }
#deskBg { position: absolute; inset: 0; width: 100%; height: 100%; }
#deskIcons {
  position: absolute; left: 18px; top: 18px; bottom: 18px; display: grid; grid-auto-flow: column;
  grid-template-rows: repeat(auto-fill, 104px); grid-auto-columns: 104px; gap: 6px 8px; align-content: start; z-index: 2;
}
.dicon { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 4px 6px; text-align: center; position: relative; }
.dicon .ic {
  width: 58px; height: 58px; display: grid; place-items: center; border: 1px solid var(--line-2);
  background: radial-gradient(circle at 50% 40%, rgba(var(--acc-rgb), .18), rgba(var(--acc-rgb), .04) 70%); position: relative;
}
.dicon .ic::before, .dicon .ic::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--acc); }
.dicon .ic::before { left: -3px; top: -3px; border-right: 0; border-bottom: 0; }
.dicon .ic::after { right: -3px; bottom: -3px; border-left: 0; border-top: 0; }
.dicon .ic svg { width: 32px; height: 32px; }
.dicon .lb { font: 700 11.5px/1.15 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); text-shadow: 0 1px 2px #000; max-width: 100px; }
.dicon:active .ic { background: var(--fill-2); }
.dicon:active .lb { color: var(--acc-2); }
.dicon.flag::after { content: ''; position: absolute; top: 6px; right: 18px; width: 8px; height: 8px; background: var(--alert); animation: pulse 1.2s infinite; }

#widgets { position: absolute; right: 16px; top: 16px; bottom: 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
.wg { flex: none; }
.wg-body { padding: 10px; }
.wg-globe { position: relative; height: 210px; }
.wg-globe canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.wg-feed { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; }
.wg-feed .feed { flex: 1; overflow: hidden; padding: 6px 10px; font: 400 11.5px/1.55 var(--f-data); color: var(--ink-dim); position: relative; }
.wg-feed .feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wg-feed .feed div b { color: var(--acc-2); font-weight: 400; }
.wg-feed .feed div.hot b { color: var(--alert); }
.wg-feed .feed::after { content: ''; position: absolute; inset: auto 0 0 0; height: 30px; background: linear-gradient(transparent, #06121b); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.stat b { display: block; font: 400 19px/1.1 var(--f-data); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font: 700 10px/1 var(--f-ui); letter-spacing: .18em; color: var(--ink-faint); text-transform: uppercase; }
.threat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.threat-row b { font: 700 18px/1 var(--f-ui); letter-spacing: .2em; color: var(--warn); }

#winLayer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#winLayer > * { pointer-events: auto; }

/* ---------- windows ---------- */
.win {
  position: absolute; display: flex; flex-direction: column; min-width: 300px; min-height: 220px;
  border: 1px solid var(--line-2); background: rgba(4, 12, 19, .965);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 18px 50px rgba(0, 0, 0, .65), 0 0 30px rgba(var(--acc-rgb), .08);
}
.win.focus { border-color: rgba(var(--acc-rgb), .8); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 22px 60px rgba(0, 0, 0, .7), 0 0 34px rgba(var(--acc-rgb), .16); }
.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-left: 0; border-right: 0; }
.win.min { display: none; }
.win-bar {
  flex: none; height: 36px; display: flex; align-items: center; gap: 10px; padding-left: 10px; cursor: grab; touch-action: none;
  background: linear-gradient(90deg, rgba(var(--acc-rgb), .2), rgba(var(--acc-rgb), .05) 55%, rgba(var(--acc-rgb), .1)); border-bottom: 1px solid var(--line-2);
}
.win:not(.focus) .win-bar { background: linear-gradient(90deg, rgba(var(--acc-rgb), .09), rgba(var(--acc-rgb), .02)); }
.win-bar .wi { width: 20px; height: 20px; flex: none; }
.win-bar .wt { font: 700 14px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.win-bar .wc { font: 700 10px/1 var(--f-ui); letter-spacing: .16em; color: var(--class-ink); background: var(--class-bar); padding: 3px 6px 2px; white-space: nowrap; }
.win-bar .sp { flex: 1; }
.win-bar .wctl { display: flex; height: 100%; flex: none; }
.win-bar .wctl button { width: 44px; height: 100%; display: grid; place-items: center; border-left: 1px solid var(--line); color: var(--ink-dim); }
.win-bar .wctl button svg { width: 14px; height: 14px; }
.win-bar .wctl button:active { background: var(--fill-2); color: var(--acc-2); }
.win-bar .wctl button.x:active { background: var(--alert); color: #000; }
.win-body { position: relative; flex: 1; min-height: 0; overflow: hidden; container-type: size; container-name: win; }
.win-rs { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; touch-action: none; cursor: nwse-resize; z-index: 5;
  background: linear-gradient(135deg, transparent 55%, var(--line-2) 55% 60%, transparent 60% 70%, var(--line-2) 70% 75%, transparent 75%); }
.win.max .win-rs { display: none; }
.win.opening { animation: winOpen .42s cubic-bezier(.2, .8, .2, 1) both; }
.win.closing { animation: winClose .26s ease-in both; pointer-events: none; }
@keyframes winOpen {
  0% { clip-path: inset(49.5% 0 49.5% 0); filter: brightness(2.2); opacity: .4; }
  45% { clip-path: inset(49.5% 0 49.5% 0); filter: brightness(2); opacity: 1; }
  100% { clip-path: inset(0 0 0 0); filter: brightness(1); }
}
@keyframes winClose {
  0% { clip-path: inset(0 0 0 0); }
  70% { clip-path: inset(49.5% 0 49.5% 0); filter: brightness(2); opacity: 1; }
  100% { clip-path: inset(49.5% 50% 49.5% 50%); opacity: 0; }
}

/* ---------- taskbar ---------- */
#taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--task-h); z-index: 40; display: flex; align-items: stretch;
  border-top: 1px solid var(--line-2); background: linear-gradient(180deg, #071823, #040b11);
}
.tb-start { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-right: 1px solid var(--line); font: 700 14px/1 var(--f-ui); letter-spacing: .24em; color: var(--acc-2); flex: none; }
.tb-start svg { width: 22px; height: 22px; }
.tb-start.on, .tb-start:active { background: var(--fill-2); }
.tb-wins { flex: 1; display: flex; align-items: stretch; gap: 2px; padding: 6px 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
.tb-wins::-webkit-scrollbar { display: none; }
.tb-win { flex: 0 1 190px; min-width: 120px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); background: var(--fill); font: 700 11.5px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; overflow: hidden; }
.tb-win svg { width: 16px; height: 16px; flex: none; }
.tb-win span { overflow: hidden; text-overflow: ellipsis; }
.tb-win.focus { color: var(--acc-2); border-color: var(--line-2); box-shadow: inset 0 -2px 0 var(--acc); background: var(--fill-2); }
.tb-win.min { opacity: .6; }
.tb-tray { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-left: 1px solid var(--line); flex: none; }
.tb-spark { width: 90px; height: 26px; }
.tb-time { text-align: right; font: 400 13px/1.15 var(--f-data); color: var(--ink); font-variant-numeric: tabular-nums; }
.tb-time small { display: block; font-size: 10.5px; color: var(--ink-dim); letter-spacing: .08em; }

#launcher {
  position: absolute; left: 0; bottom: var(--task-h); width: 340px; max-height: calc(100% - var(--task-h) - var(--top-h) - 10px); z-index: 45;
  border: 1px solid var(--line-2); background: rgba(4, 13, 20, .97); box-shadow: 0 -10px 40px rgba(0, 0, 0, .6); display: flex; flex-direction: column;
}
#launcher .ln-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
#launcher .ln-head svg { width: 40px; height: 40px; }
#launcher .ln-head b { display: block; font: 700 16px/1.1 var(--f-ui); letter-spacing: .2em; }
#launcher .ln-head small { font: 400 11px/1.2 var(--f-data); color: var(--ink-dim); }
#launcher .ln-list { padding: 6px 0; }
#launcher .ln-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 16px; text-align: left; font: 700 13.5px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; }
#launcher .ln-item svg { width: 22px; height: 22px; flex: none; }
#launcher .ln-item small { margin-left: auto; font: 400 10.5px/1 var(--f-data); color: var(--ink-faint); letter-spacing: .04em; }
#launcher .ln-item:active { background: var(--fill-2); }
#launcher .ln-foot { border-top: 1px solid var(--line); display: flex; }
#launcher .ln-foot button { flex: 1; padding: 13px 0; font: 700 12px/1 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim); border-right: 1px solid var(--line); }
#launcher .ln-foot button:last-child { border-right: 0; }
#launcher .ln-foot button:active { background: var(--fill-2); color: var(--acc-2); }

/* ---------- overlays: grain + scanlines ---------- */
#grain, #scan { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
#grain { opacity: .07; background-size: 160px 160px; mix-blend-mode: screen; }
#scan { background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); }
#app:not(.fx-grain) #grain, #app:not(.fx-scan) #scan { display: none; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .55)); }

/* ---------- compact (phone) ---------- */
#app.compact { --top-h: 52px; --task-h: 48px; }
#app.compact .sysbar { height: 32px; }
#app.compact .sb-brand { padding: 0 10px; }
#app.compact .sb-brand small, #app.compact .sb-ind.hide-c, #app.compact .sb-op, #app.compact .sb-clock.hide-c, #app.compact .tb-spark { display: none; }
#app.compact .sb-clock { padding: 0 8px; }
#app.compact .sb-right { padding: 0 10px; gap: 10px; }
#app.compact .classbar { font-size: 10px; letter-spacing: .18em; }
#app.compact .classbar .cb-side { display: none; }
#app.compact #widgets { display: none; }
#app.compact #deskIcons { left: 0; right: 0; top: 0; bottom: auto; padding: 16px; grid-auto-flow: row; grid-template-rows: none; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); grid-auto-columns: auto; justify-items: center; }
#app.compact .tb-start span { display: none; }
#app.compact .tb-tray { padding: 0 10px; }
#app.compact .tb-win { min-width: 44px; flex-basis: 44px; padding: 0 12px; }
#app.compact .tb-win span { display: none; }
#app.compact .win-bar .wctl .mx, #app.compact .win-bar .wc { display: none; }
#app.compact #launcher { width: 100%; }
@media (max-width: 1100px) { #app:not(.compact) .sb-clock.hide-m { display: none; } }

@media (prefers-reduced-motion: reduce) {
  .win.opening, .win.closing { animation-duration: .01s; }
}

canvas.fill { position: absolute; inset: 0; width: 100%; height: 100%; }
.desk-mark { position: absolute; left: calc(50% - 40px); top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: .08; pointer-events: none; text-align: center; z-index: 1; }
.desk-mark svg { width: 210px; height: 210px; }
.desk-mark b { font: 700 40px/1 var(--f-ui); letter-spacing: .5em; margin-right: -.5em; color: var(--acc-2); }
.desk-mark span { font: 600 13px/1.2 var(--f-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--acc-2); max-width: 420px; }
#app.compact .desk-mark { display: none; }
.toast { position: absolute; left: 50%; bottom: calc(var(--task-h) + 14px); transform: translateX(-50%); z-index: 86; display: flex; align-items: center; gap: 12px; max-width: min(560px, 94vw); padding: 10px 12px 10px 14px; border: 1px solid var(--warn); background: rgba(20, 12, 0, .94); color: #ffe2ae; font: 400 12.5px/1.4 var(--f-data); }
.toast b { color: var(--warn); font-weight: 400; }
.toast button { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid rgba(var(--warn-rgb), .5); color: var(--warn); }
.toast button svg { width: 14px; height: 14px; }

/* ---------- boot ---------- */
#boot { background: #000; z-index: 70; overflow: hidden; cursor: pointer; }
#boot .bt-log { position: absolute; left: 28px; top: 24px; right: 28px; bottom: 120px; overflow: hidden; font: 400 13px/1.5 var(--f-data); color: var(--ink-dim); }
#boot .bt-log div { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#boot .bt-log div b { color: var(--ok); font-weight: 400; }
#boot .bt-log div.h { color: var(--acc-2); }
#boot .bt-log div.w b { color: var(--warn); }
#boot .bt-center { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .6s; pointer-events: none; }
#boot.phase2 .bt-center { opacity: 1; }
#boot.phase2 .bt-log { opacity: .12; transition: opacity .6s; }
#boot .bt-mark { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 0 20px; }
#boot .bt-mark svg { width: 120px; height: 120px; }
#boot .bt-mark b { font: 700 34px/1 var(--f-ui); letter-spacing: .5em; margin-right: -.5em; color: var(--ink); }
#boot .bt-mark span { font: 600 13px/1.3 var(--f-ui); letter-spacing: .3em; color: var(--ink-dim); text-transform: uppercase; }
#boot .bt-prog { width: min(360px, 80vw); margin-top: 10px; }
#boot .bt-prog .meter { height: 4px; }
#boot .bt-prog .mono { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; color: var(--ink-dim); }
#boot .bt-skip { position: absolute; right: 22px; bottom: 18px; font: 400 11px/1 var(--f-data); color: var(--ink-faint); letter-spacing: .1em; }

/* ---------- login ---------- */
#login { z-index: 60; background: var(--bg); overflow: hidden; }
#login canvas.lg-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
#login .lg-class { position: absolute; inset: 0 0 auto 0; }
#login .lg-wrap { position: absolute; inset: 20px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; overflow: auto; touch-action: pan-y; }
.lg-card { position: relative; width: min(620px, 100%); padding: 22px 26px 18px; border: 1px solid var(--line); background: rgba(4, 12, 19, .86); --bl: 16px; --bc: var(--acc); }
.lg-head { display: flex; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.lg-head svg { width: 64px; height: 64px; flex: none; }
.lg-head b { display: block; font: 700 28px/1 var(--f-ui); letter-spacing: .42em; color: var(--ink); }
.lg-head span { display: block; margin-top: 6px; font: 600 12.5px/1.25 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); }
.lg-warn { margin-top: 14px; padding: 7px 10px; border: 1px solid rgba(var(--alert-rgb), .5); background: rgba(var(--alert-rgb), .08); color: #ffb0b0; font: 700 12px/1.2 var(--f-ui); letter-spacing: .2em; text-align: center; text-transform: uppercase; }
.lg-id { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; font: 400 12px/1.3 var(--f-data); color: var(--ink-dim); }
.lg-id b { color: var(--ink); font-weight: 400; }
.lg-main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin-top: 18px; }
.lg-bio { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fp-pad { position: relative; width: 150px; height: 170px; border: 1px solid var(--line-2); background: rgba(var(--acc-rgb), .04); touch-action: none; }
.fp-pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.fp-pad .fp-ring { position: absolute; inset: 8px; }
.fp-pad .fp-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--acc); box-shadow: 0 0 12px var(--acc); top: 0; opacity: 0; }
.fp-pad.scanning .fp-line { opacity: 1; animation: fpline 1s linear infinite alternate; }
@keyframes fpline { from { top: 6%; } to { top: 94%; } }
.lg-bio > span, .lg-pin > span { font: 700 11px/1 var(--f-ui); letter-spacing: .2em; color: var(--ink-dim); text-transform: uppercase; }
.lg-or { font: 700 11px/1 var(--f-ui); letter-spacing: .2em; color: var(--ink-faint); writing-mode: vertical-rl; display: flex; align-items: center; gap: 10px; }
.lg-or::before, .lg-or::after { content: ''; width: 1px; height: 50px; background: var(--line); }
.lg-pin { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pin-dots { display: flex; gap: 8px; height: 22px; align-items: center; }
.pin-dots i { width: 14px; height: 14px; border: 1px solid var(--line-2); }
.pin-dots i.on { background: var(--acc); border-color: var(--acc); }
.keypad { display: grid; grid-template-columns: repeat(3, 58px); gap: 6px; }
.keypad button { height: 44px; border: 1px solid var(--line-2); background: var(--fill); font: 400 20px/1 var(--f-data); color: var(--ink); }
.keypad button.k-fn { font: 700 11px/1 var(--f-ui); letter-spacing: .16em; color: var(--ink-dim); }
.keypad button:active { background: var(--acc); color: var(--bg); }
.lg-status { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-dim); }
.lg-status b { font-weight: 400; color: var(--acc-2); }
.lg-status.bad b { color: var(--alert); }
.lg-status.good b { color: var(--ok); }
.lg-legal { width: min(620px, 100%); margin: 0; font: 400 10.5px/1.5 var(--f-data); color: var(--ink-faint); text-align: center; letter-spacing: .03em; }
.lg-card.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@media (max-width: 600px) {
  .lg-main { grid-template-columns: 1fr; }
  .lg-or { writing-mode: horizontal-tb; justify-content: center; }
  .lg-or::before, .lg-or::after { width: 50px; height: 1px; }
  .lg-head b { font-size: 22px; letter-spacing: .3em; }
  .lg-card { padding: 18px 16px 14px; }
}

/* ---------- cue overlays ---------- */
#fx { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
#fx > * { pointer-events: auto; }
.cue-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; }
.cue-wrap.dim { background: rgba(0, 0, 0, .55); }
.cue-box { position: relative; min-width: min(560px, 92vw); max-width: 92vw; padding: 26px 34px; border: 2px solid currentColor; background: rgba(3, 8, 12, .93); text-align: center; animation: cueIn .35s cubic-bezier(.2, .9, .2, 1) both; }
.cue-box .c-sub { font: 700 13px/1.3 var(--f-ui); letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
.cue-box .c-main { margin: 10px 0; font: 700 clamp(34px, 7vw, 68px)/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; }
.cue-box .c-foot { font: 400 13px/1.4 var(--f-data); opacity: .75; }
.cue-box.c-red { color: var(--alert); box-shadow: 0 0 60px rgba(var(--alert-rgb), .35), inset 0 0 40px rgba(var(--alert-rgb), .15); }
.cue-box.c-red .c-main { animation: blink .7s steps(2) 3; }
.cue-box.c-ok { color: var(--ok); box-shadow: 0 0 60px rgba(var(--ok-rgb), .3), inset 0 0 40px rgba(var(--ok-rgb), .12); }
.cue-box.c-acc { color: var(--acc); box-shadow: 0 0 60px rgba(var(--acc-rgb), .3), inset 0 0 40px rgba(var(--acc-rgb), .12); }
.cue-box.c-amb { color: var(--warn); box-shadow: 0 0 60px rgba(var(--warn-rgb), .3), inset 0 0 40px rgba(var(--warn-rgb), .12); }
@keyframes cueIn { 0% { transform: scaleY(.02) scaleX(1.2); opacity: 0; } 50% { transform: scaleY(.02); opacity: 1; } 100% { transform: none; } }
.cue-match { display: flex; gap: 22px; align-items: center; text-align: left; }
.cue-match canvas { width: 150px; height: 180px; border: 1px solid currentColor; flex: none; }
.cue-match .c-main { font-size: clamp(30px, 5vw, 50px); margin: 6px 0 8px; }
.cue-match .c-name { font: 700 24px/1.1 var(--f-ui); letter-spacing: .12em; color: var(--ink); }
.cue-match .c-row { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 560px) { .cue-match { flex-direction: column; text-align: center; } .cue-match .c-row { justify-content: center; } }

.cue-intrusion { position: absolute; inset: 0; pointer-events: none !important; box-shadow: inset 0 0 0 4px var(--alert), inset 0 0 120px rgba(var(--alert-rgb), .45); animation: pulse .9s infinite; }
.cue-banner { position: absolute; left: 50%; top: calc(var(--top-h) + 16px); transform: translateX(-50%); width: min(760px, 94vw); display: flex; align-items: center; gap: 16px; padding: 12px 18px; border: 2px solid var(--alert); background: rgba(30, 0, 0, .92); color: #ffd0d0; box-shadow: 0 0 40px rgba(var(--alert-rgb), .4); }
.cue-banner .cb-ic { width: 40px; height: 40px; flex: none; color: var(--alert); animation: blink .8s steps(2) infinite; }
.cue-banner b { display: block; font: 700 22px/1 var(--f-ui); letter-spacing: .2em; color: var(--alert); }
.cue-banner span { display: block; margin-top: 5px; font: 400 12.5px/1.3 var(--f-data); }
.cue-banner .cb-trace { margin-left: auto; text-align: right; font: 400 24px/1 var(--f-data); color: #fff; font-variant-numeric: tabular-nums; }
.cue-banner .cb-trace small { display: block; font: 700 10px/1 var(--f-ui); letter-spacing: .2em; color: var(--alert); margin-bottom: 4px; }
.cue-lock { position: absolute; inset: 0; display: grid; place-items: center; background: repeating-linear-gradient(-45deg, rgba(var(--warn-rgb), .06) 0 24px, transparent 24px 48px), rgba(0, 0, 0, .78); }
.cue-count { position: absolute; left: 50%; top: calc(var(--top-h) + 14px); transform: translateX(-50%); padding: 10px 22px 12px; border: 2px solid var(--alert); background: rgba(20, 0, 0, .9); text-align: center; color: var(--alert); min-width: 280px; }
.cue-count small { font: 700 12px/1 var(--f-ui); letter-spacing: .3em; }
.cue-count b { display: block; font: 400 54px/1 var(--f-data); color: #fff; margin-top: 6px; font-variant-numeric: tabular-nums; }
.cue-count .meter { margin-top: 10px; background: rgba(var(--alert-rgb), .2); }
.cue-count .meter > i { background: var(--alert); }
.cue-signal { position: absolute; inset: 0; }
.cue-signal canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cue-signal .cs-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 26px; background: #000; border: 2px solid var(--ink); font: 700 clamp(26px, 5vw, 46px)/1 var(--f-ui); letter-spacing: .3em; color: var(--ink); white-space: nowrap; }
.cue-msg { width: min(640px, 94vw); text-align: left; }
.cue-msg .c-body { margin-top: 14px; min-height: 90px; padding: 14px; border: 1px solid var(--line); background: rgba(0, 0, 0, .4); font: 400 15px/1.55 var(--f-doc); color: var(--ink); white-space: pre-wrap; }
.cue-msg .c-body i.cur { display: inline-block; width: 9px; height: 1.1em; vertical-align: -2px; background: var(--acc); animation: blink 1s steps(2) infinite; }
.cue-msg .c-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.cue-msg .c-main { font-size: clamp(22px, 4vw, 34px); margin: 0; letter-spacing: .12em; }

#app.glitch { animation: glitch .14s steps(2) infinite; }
#app.glitch .win, #app.glitch #widgets { animation: glitchShift .2s steps(3) infinite; }
@keyframes glitch {
  0% { filter: none; transform: none; }
  25% { filter: hue-rotate(-14deg) saturate(2) brightness(1.3); transform: translate(3px, -1px); }
  50% { filter: invert(.07) contrast(1.6); transform: translate(-4px, 2px) skewX(1deg); }
  75% { filter: brightness(.7); transform: translate(2px, 0); }
}
@keyframes glitchShift { 0% { clip-path: inset(0 0 0 0); } 33% { clip-path: inset(12% 0 40% 0); transform: translateX(8px); } 66% { clip-path: inset(50% 0 8% 0); transform: translateX(-10px); } }
#app.alert-mode { --acc-rgb: 255, 80, 80; --acc2-rgb: 255, 190, 190; }

/* ---------- director (prop control) ---------- */
#director {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 100; display: flex; flex-direction: column;
  background: #0b0904; border-left: 2px solid var(--class-bar); box-shadow: -20px 0 60px rgba(0, 0, 0, .7); color: #f3e3c4;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
#director .dr-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--class-bar); color: var(--class-ink); }
#director .dr-head b { font: 700 15px/1 var(--f-ui); letter-spacing: .24em; }
#director .dr-head small { display: block; font: 600 11px/1.2 var(--f-ui); letter-spacing: .1em; margin-top: 3px; }
#director .dr-head button { margin-left: auto; width: 38px; height: 38px; border: 1px solid rgba(0, 0, 0, .5); display: grid; place-items: center; }
#director .dr-head button svg { width: 16px; height: 16px; }
#director .dr-body { flex: 1; padding: 6px 14px 20px; }
#director h4 { margin: 16px 0 8px; font: 700 11.5px/1 var(--f-ui); letter-spacing: .24em; color: var(--class-bar); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
#director h4::after { content: ''; flex: 1; height: 1px; background: rgba(242, 165, 22, .3); }
#director .dr-note { font: 400 11.5px/1.45 var(--f-data); color: #b49f7a; margin: 0 0 8px; }
.dr-cues { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dr-cues button { min-height: 44px; padding: 6px 8px; border: 1px solid rgba(242, 165, 22, .45); background: rgba(242, 165, 22, .07); font: 700 12px/1.15 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: #ffe2ae; text-align: left; display: flex; align-items: center; gap: 8px; }
.dr-cues button i { width: 8px; height: 8px; flex: none; background: currentColor; }
.dr-cues button.red { color: #ff9c9c; border-color: rgba(255, 90, 90, .5); }
.dr-cues button.grn { color: #9cf5c9; border-color: rgba(70, 240, 166, .4); }
.dr-cues button.blu { color: #a8e9ff; border-color: rgba(54, 212, 255, .45); }
.dr-cues button:active { background: var(--class-bar); color: #000; }
.dr-cues button.wide { grid-column: span 2; justify-content: center; }
.dr-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
.dr-row label { flex: 0 0 120px; font: 600 12px/1.2 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: #cdb88f; }
.dr-row .field-in, .dr-row select { flex: 1; min-width: 0; min-height: 34px; font-size: 13px; border-color: rgba(242, 165, 22, .45); color: #fff1d6; background: rgba(0, 0, 0, .4); }
.dr-row select { padding: 0 10px; font: 400 13px/1 var(--f-data); border: 1px solid rgba(242, 165, 22, .45); border-radius: 0; -webkit-appearance: none; appearance: none; }
.dr-row textarea.field-in { min-height: 70px; padding: 8px 10px; line-height: 1.4; resize: vertical; }
.sw { display: flex; gap: 6px; flex: 1; }
.sw button { flex: 1; height: 34px; border: 1px solid rgba(255, 255, 255, .2); position: relative; }
.sw button.on { outline: 2px solid #fff; outline-offset: 1px; }
.tgl { flex: 1; display: flex; justify-content: flex-end; }
.tgl button { width: 64px; height: 30px; border: 1px solid rgba(242, 165, 22, .5); font: 700 12px/1 var(--f-ui); letter-spacing: .14em; color: #cdb88f; }
.tgl button.on { background: var(--class-bar); color: #000; }
.dr-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.dr-actions button { flex: 1 1 45%; min-height: 38px; border: 1px solid rgba(242, 165, 22, .45); font: 700 12px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #ffe2ae; }
.dr-actions button:active { background: var(--class-bar); color: #000; }
#app.edit-mode [data-edit] { outline: 1px dashed rgba(var(--warn-rgb), .8); outline-offset: 2px; cursor: text; }
#app.edit-mode [data-edit]:focus { outline-style: solid; background: rgba(var(--warn-rgb), .08); }
.edit-hint { position: absolute; left: 50%; bottom: calc(var(--task-h) + 10px); transform: translateX(-50%); z-index: 85; padding: 7px 14px; border: 1px solid var(--warn); background: rgba(20, 12, 0, .92); color: var(--warn); font: 700 12px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
#os.power-on { animation: powerOn .7s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes powerOn {
  0% { transform: scale(.6, .004); filter: brightness(3); }
  40% { transform: scale(1, .004); filter: brightness(2.6); }
  100% { transform: none; filter: none; }
}

/* ---------- Civilian Information Files ---------- */
.cif { position: absolute; inset: 0; display: flex; flex-direction: column; }
.cif-search { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cif-q { flex: 1 1 240px; position: relative; display: flex; min-width: 0; }
.cif-q svg { position: absolute; left: 11px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--acc); pointer-events: none; }
.cif-q input { padding-left: 38px; }
.cif-listbtn { display: none; }
.cif-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); position: relative; }
.cif-list { border-right: 1px solid var(--line); background: rgba(0, 0, 0, .22); }
.cif-row { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid rgba(var(--acc-rgb), .08); text-align: left; }
.cif-row canvas { width: 34px; height: 40px; border: 1px solid var(--line); }
.cif-row .cr-main { min-width: 0; }
.cif-row .cr-main b { display: block; font: 700 13.5px/1.15 var(--f-ui); letter-spacing: .06em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cif-row .cr-main small { display: block; margin-top: 2px; font: 400 11px/1.3 var(--f-data); color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cif-row .cr-side { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-dim); }
.sq { width: 9px; height: 9px; background: currentColor; display: inline-block; }
.sq.t-red { color: var(--alert); } .sq.t-amb { color: var(--warn); } .sq.t-acc { color: var(--acc); } .sq.t-ok { color: var(--ok); } .sq.t-dim { color: var(--ink-faint); }

.cf-pv { position: absolute; inset: 0; }
.cf-pl { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px; font-size: 9.5px; color: var(--ink-dim); text-align: center; background: rgba(0, 0, 0, .65); }
.cf-photo-hint { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 4px; background: rgba(20, 12, 0, .9); color: var(--warn); font: 700 10.5px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; text-align: center; }
.cf-portrait.editable { cursor: pointer; outline: 1px dashed var(--warn); outline-offset: 2px; }

.cf-alias { font-size: 12px; color: var(--warn); }
.cf-occ { font: 600 14px/1.3 var(--f-ui); letter-spacing: .06em; color: var(--ink-dim); text-transform: uppercase; }
.cf-acts { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
.cf-acts .btn svg { width: 15px; height: 15px; }
.cf-gauge { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cf-gv { position: relative; width: 150px; height: 150px; }
.cf-gauge > span { font: 700 11px/1 var(--f-ui); color: var(--ink-dim); }
.cf-tabs { padding: 8px 12px 0; }
.cf-body { flex: 1; min-height: 0; padding: 12px; }
.cf-body .panel { overflow-x: auto; }
.cf-ov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; align-items: start; }
.cf-kv { padding: 10px 12px; margin: 0; }
.cf-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cf-last { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.cf-last b { font: 700 17px/1.2 var(--f-ui); letter-spacing: .08em; color: var(--warn); }
.cf-last span { font-size: 12px; color: var(--ink-dim); }
.cf-notes { padding: 10px 12px; font: 400 13.5px/1.62 var(--f-doc); color: var(--ink); }
.cf-risk { padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
.rk { display: grid; grid-template-columns: 130px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font: 600 12px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.rk b { font-weight: 400; color: var(--ink); text-align: right; }
.meter.seg-m.hot > i { background: repeating-linear-gradient(90deg, var(--alert) 0 5px, transparent 5px 7px); }

.cf-net { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 12px; height: 100%; min-height: 380px; }
.cf-svg { width: 100%; height: 100%; min-height: 360px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); }
.cf-svg .el { font: 600 9.5px var(--f-ui); letter-spacing: .12em; fill: var(--ink-dim); }
.cf-svg .nl { font: 700 10.5px var(--f-ui); letter-spacing: .1em; fill: var(--ink); }
.cf-svg .ni { font: 400 17px var(--f-data); }
.cf-svg .ni.big { font-size: 24px; }
.cf-svg .ln { stroke-dasharray: 420; stroke-dashoffset: 420; animation: drawln .9s ease-out forwards; }
.cf-svg .ln[stroke-dasharray="5 4"] { stroke-dasharray: 5 4; stroke-dashoffset: 0; animation: fadein .9s both; }
.cf-svg .nd { animation: ndIn .5s both; transform-box: fill-box; transform-origin: center; }

@keyframes drawln { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } }

.cf-netlist { border: 1px solid var(--line); background: rgba(6, 18, 28, .72); overflow: auto; touch-action: pan-y; }
.cf-arow { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(var(--acc-rgb), .08); }
.cf-arow b { font: 700 12.5px/1.2 var(--f-ui); letter-spacing: .06em; }
.cf-arow small { grid-column: 1; font: 400 10.5px/1.3 var(--f-data); color: var(--ink-dim); }
.cf-arow .tag { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.cf-arow[disabled] { opacity: .55; cursor: default; }
.cf-arow:not([disabled]):active { background: var(--fill-2); }

.cf-moves { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 12px; height: 100%; min-height: 340px; }
.cf-map { position: relative; border: 1px solid var(--line); min-height: 320px; }
.cf-mlist { border: 1px solid var(--line); background: rgba(6, 18, 28, .72); }
.cf-mrow { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(var(--acc-rgb), .08); }
.cf-mrow .num { font-size: 11px; color: var(--ink-dim); }
.cf-mrow b { grid-column: 1 / span 2; font: 700 12.5px/1.2 var(--f-ui); letter-spacing: .06em; }
.cf-mrow .tag { grid-row: 1; grid-column: 2; justify-self: end; }
.cf-mrow.on { background: var(--fill-2); box-shadow: inset 3px 0 0 var(--alert); }

.cf-comms, .cf-fin, .cf-travel { display: flex; flex-direction: column; gap: 12px; }
.cf-hours { display: flex; align-items: flex-end; gap: 3px; height: 74px; padding: 10px 12px 4px; }
.cf-hours i { flex: 1; background: var(--acc); opacity: .85; }
.cf-hours-ax { display: flex; justify-content: space-between; padding: 0 12px 8px; font-size: 10px; color: var(--ink-faint); }
.cf-irow { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid rgba(var(--acc-rgb), .08); text-align: left; font: 600 13px/1.2 var(--f-ui); letter-spacing: .06em; }
.cf-irow b { font: 400 13px var(--f-data); color: var(--acc-2); }
.cf-irow span:nth-of-type(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-irow:active { background: var(--fill-2); }
.dt { width: 100%; border-collapse: collapse; font: 400 12.5px/1.3 var(--f-data); font-variant-numeric: tabular-nums; }
.dt th { text-align: left; padding: 7px 10px; font: 700 10.5px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); border-bottom: 1px solid var(--line); background: #061019; white-space: nowrap; }
.dt td { padding: 6px 10px; border-bottom: 1px solid rgba(var(--acc-rgb), .07); white-space: nowrap; }
.dt tr.hot td { color: #ffc9c9; background: rgba(var(--alert-rgb), .06); }
.dt .r { text-align: right; }
.cf-bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 12px; }
.cf-bars > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.cf-bars i { width: 100%; background: linear-gradient(var(--acc), rgba(var(--acc-rgb), .25)); }
.cf-bars i.hot { background: linear-gradient(var(--alert), rgba(var(--alert-rgb), .25)); }
.cf-bars span { font-size: 10px; color: var(--ink-faint); }

.cf-query { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(2, 6, 10, .84); padding: 16px; }
.cq-in { width: min(540px, 100%); border: 1px solid var(--line-2); background: rgba(4, 12, 19, .97); }
.cq-rows { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
.cq-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 64px; gap: 12px; align-items: center; font: 600 12.5px/1.1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.cq-row b { font-weight: 400; text-align: right; color: var(--acc-2); font-size: 12px; }
.cq-res { padding: 4px 14px 16px; font-size: 13px; min-height: 22px; letter-spacing: .06em; }
.cif-foot { flex: none; display: flex; justify-content: space-between; gap: 12px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .06em; white-space: nowrap; overflow: hidden; }

@container win (max-width: 840px) {
  .cif-main { grid-template-columns: minmax(0, 1fr); }
  .cif-list { position: absolute; left: 0; top: 0; bottom: 0; width: min(320px, 88%); z-index: 6; transform: translateX(-103%); transition: transform .25s; background: #050e16; box-shadow: 20px 0 40px rgba(0, 0, 0, .6); }
  .cif.list-open .cif-list { transform: none; }

  .cf-head { grid-template-columns: 112px minmax(0, 1fr); gap: 12px; }
  .cf-portrait { width: 112px; height: 134px; }
  .cf-gauge { display: none; }
  .cf-name { font-size: 22px; }
  .cf-ov, .cf-net, .cf-moves { grid-template-columns: minmax(0, 1fr); height: auto; }
  .cf-net .cf-svg { height: 330px; }
  .cf-moves .cf-map { height: 300px; }
  .cf-mlist { max-height: 260px; }
  .cif-seg { order: 5; }
  .cif-foot span:last-child { display: none; }
}
@container win (max-width: 460px) {
  .cif-seg > button { padding: 0 8px; }
  .cf-acts .btn { flex: 1 1 40%; }
  .rk { grid-template-columns: 100px minmax(0, 1fr) 26px; }
  .cq-row { grid-template-columns: minmax(0, 1fr) 70px 52px; }
}

/* ---------- Orbital Command ---------- */
.orb { position: absolute; inset: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 290px; grid-template-rows: minmax(0, 1fr) auto; }
.orb-sats { grid-row: 1; grid-column: 1; border-width: 0 1px 0 0; display: flex; flex-direction: column; min-height: 0; }
.orb-list { flex: 1; min-height: 0; }
.orb-row { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid rgba(var(--acc-rgb), .08); text-align: left; }
.orb-row b { display: block; font: 700 13px/1.15 var(--f-ui); letter-spacing: .08em; white-space: nowrap; }
.orb-row small { display: block; margin-top: 2px; font: 400 10.5px/1.2 var(--f-data); color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.or-main { min-width: 0; }
.or-sig { height: 5px; background: rgba(var(--acc-rgb), .12); position: relative; }
.or-sig i { position: absolute; inset: 0 auto 0 0; background: var(--acc); }
.orb-row.on { background: var(--fill-2); box-shadow: inset 3px 0 0 var(--acc); }
.orb-row:active { background: var(--fill); }
.orb-view { grid-row: 1; grid-column: 2; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.orb-cv { position: absolute; inset: 0; }
.orb-hud.tl { position: absolute; left: 22px; top: 20px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.orb-hud b { font: 700 13px/1 var(--f-ui); letter-spacing: .24em; color: var(--acc-2); }
.orb-hud span { font-size: 11px; color: var(--ink-dim); }
.orb-ctl { position: absolute; right: 20px; top: 18px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.orb-ctl .btn svg { width: 14px; height: 14px; }
.orb-task { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(390px, calc(100% - 24px)); }
.ot-box { border: 1px solid var(--alert); background: rgba(10, 4, 4, .92); }
.ot-box .panel-h { color: #ffc0c0; background: linear-gradient(90deg, rgba(var(--alert-rgb), .25), transparent); border-bottom-color: rgba(var(--alert-rgb), .4); }
.ot-box .panel-h::before { background: var(--alert); }
.ot-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.ot-state { font: 700 18px/1 var(--f-ui); letter-spacing: .18em; color: var(--warn); }
.ot-state.ok { color: var(--ok); }
.ot-body .meter > i { background: var(--alert); }
.ot-sub { font-size: 11.5px; color: var(--ink-dim); }
.ot-act { display: flex; gap: 8px; flex-wrap: wrap; }
.orb-info { grid-row: 1; grid-column: 3; border-width: 0 0 0 1px; display: flex; flex-direction: column; min-height: 0; }
.orb-tele { flex: 1; min-height: 0; }
.orb-kv { padding: 10px 12px; margin: 0; }
.orb-kv dd { font-size: 12.5px; }
.orb-sig2 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 2px 12px 12px; font: 700 11px/1 var(--f-ui); color: var(--ink-faint); }
.orb-sig2 b { font-weight: 400; color: var(--ink); font-size: 12px; }
.orb-tgts { padding: 6px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.orb-tgt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 8px; padding: 7px 8px; border: 1px solid var(--line); text-align: left; background: rgba(0, 0, 0, .2); }
.orb-tgt b { grid-row: 1 / span 2; font: 400 18px/1 var(--f-data); color: var(--warn); align-self: center; text-align: center; }
.orb-tgt span { font: 700 12.5px/1.15 var(--f-ui); letter-spacing: .1em; }
.orb-tgt small { font: 400 10px/1.25 var(--f-data); color: var(--ink-dim); }
.orb-tgt:active { background: rgba(var(--warn-rgb), .15); border-color: var(--warn); }
.orb-log { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 6px 12px; font-size: 11px; color: var(--ink-dim); min-height: 56px; }
.orb-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
.orb-log b { color: var(--acc); font-weight: 400; }
.orb-log .w { color: var(--warn); }
.orb-log .h { color: var(--acc-2); }
@container win (max-width: 900px) {
  .orb { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; }
  .orb-sats, .orb-view, .orb-info { grid-row: auto; grid-column: auto; }
  .orb-sats { border-width: 0 0 1px 0; }
  .orb-sats .panel-h { display: none; }
  .orb-list { display: flex; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; }
  .orb-row { width: auto; flex: none; grid-template-columns: 10px auto; border-bottom: 0; border-right: 1px solid rgba(var(--acc-rgb), .1); }
  .orb-row small, .or-sig { display: none; }
  .orb-info { border-width: 1px 0 0 0; max-height: 230px; }
  .orb-tgts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .orb-log { min-height: 0; }
  .orb-log div:nth-child(n+3) { display: none; }
}

/* ---------- Surveillance Network ---------- */
.cc { position: absolute; inset: 0; display: flex; flex-direction: column; }
.cc-top { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cc-top .btn svg { width: 14px; height: 14px; }
.cc-title { font: 700 15px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--acc-2); }
.cc-sub { font-size: 11px; }
.cc-top .sp { flex: 1; }
.cc-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; background: #000; }
.cc-tile { position: relative; border: 1px solid rgba(var(--acc-rgb), .25); overflow: hidden; min-height: 0; background: #000; }
.cc-tile:active { border-color: var(--acc); }
.cc-cv { position: absolute; inset: 0; }
.cc-focus { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 272px; }
.cc-big { position: relative; background: #000; overflow: hidden; }
.cc-ptz { position: absolute; right: 12px; bottom: 34px; display: flex; gap: 4px; }
.cc-ptz .btn { min-height: 36px; width: 40px; padding: 0; background: rgba(0, 0, 0, .6); }
.cc-ptz .btn svg { width: 16px; height: 16px; }
.cc-hint { position: absolute; left: 12px; bottom: 36px; font-size: 10.5px; color: rgba(255, 255, 255, .65); background: rgba(0, 0, 0, .5); padding: 3px 8px; pointer-events: none; white-space: nowrap; }
.cc-side { border-width: 0 0 0 1px; display: flex; flex-direction: column; min-height: 0; overflow: auto; touch-action: pan-y; }
.cc-kv { padding: 10px 12px; margin: 0; }
.cc-kv dd { font-size: 12px; }
.cc-enh { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.cc-enh-cv { position: relative; width: 100%; height: 260px; border: 1px solid var(--line); flex: none; }
.cc-enh-txt { font-size: 12px; line-height: 1.5; min-height: 36px; }
.cc-enh-btns { padding: 0 12px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
@container win (max-width: 820px) {
  .cc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
  .cc-focus { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .cc-side { border-width: 1px 0 0 0; max-height: 210px; }
  .cc-side > .panel-h:first-child, .cc-kv { display: none; }
  .cc-enh { flex-direction: row; align-items: flex-start; }
  .cc-enh-cv { width: 120px; height: 144px; }
  .cc-sub, .cc-hint { display: none; }
  .cc-ptz { bottom: 30px; right: 8px; }
}
@container win (max-width: 480px) {
  .cc-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: 170px; overflow: auto; touch-action: pan-y; }
  .cc-ptz .btn { width: 34px; }
}

/* ---------- Aerial Reconnaissance ---------- */
.aer { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 262px; }
.aer-view { position: relative; overflow: hidden; background: #000; }
.aer-img, .aer-hud { position: absolute; inset: 0; }
.aer-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.aer-flash.on { animation: flashOut .5s ease-out; }
@keyframes flashOut { 0% { opacity: .85; } 100% { opacity: 0; } }
.aer-side { border-width: 0 0 0 1px; display: flex; flex-direction: column; min-height: 0; }
.aer-sec { padding: 10px 12px; }
.aer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.aer-btns .btn svg { width: 13px; height: 13px; }
.aer-tgt { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.aer-tname { font: 700 14px/1.2 var(--f-ui); letter-spacing: .1em; color: var(--warn); }
.aer-lock .kv dd { font-size: 12.5px; }
.aer-lock p { margin: 0; font-size: 11.5px; }
.aer-lk-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.aer-list { flex: 1; min-height: 0; padding: 4px 0; }
.aer-trow { width: 100%; display: flex; gap: 10px; align-items: center; padding: 7px 12px; text-align: left; font: 700 12.5px/1.2 var(--f-ui); letter-spacing: .08em; border-bottom: 1px solid rgba(var(--acc-rgb), .07); }
.aer-trow b { font: 400 15px/1 var(--f-data); color: var(--warn); width: 16px; }
.aer-trow.on { background: var(--fill-2); box-shadow: inset 3px 0 0 var(--warn); }
@container win (max-width: 820px) {
  .aer { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .aer-side { border-width: 1px 0 0 0; flex-direction: row; flex-wrap: wrap; align-items: flex-start; max-height: 46%; overflow: auto; touch-action: pan-y; }
  .aer-side .panel-h, .aer-tgt, .aer-list { display: none; }
  .aer-sec { padding: 8px 10px; }
  .aer-btns { grid-template-columns: repeat(4, auto); }
  .aer-lock { flex: 1 1 100%; padding-top: 0; }
}

/* ---------- Signals Intercept ---------- */
.sg { position: absolute; inset: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
.sg-list { border-width: 0 1px 0 0; display: flex; flex-direction: column; min-height: 0; }
.sg-items { flex: 1; min-height: 0; }
.sg-item { width: 100%; display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border-bottom: 1px solid rgba(var(--acc-rgb), .08); text-align: left; }

  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ---------- animation loop ---------- */
const Loop = {
  fns: new Set(),
  add(fn) { this.fns.add(fn); return () => this.fns.delete(fn); }
};
(function () {
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    const t = now / 1000;
    if (!document.hidden) for (const f of Loop.fns) { try { f(t, dt); } catch (e) { console.error(e); Loop.fns.delete(f); } }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* Canvas that tracks its CSS box and draws in CSS pixels. */
function makeCanvas(parent, opts = {}) {
  const cv = document.createElement('canvas');
  cv.className = opts.cls || 'fill';
  parent.appendChild(cv);
  const o = { cv, ctx: cv.getContext('2d'), w: 0, h: 0, dpr: 1, onresize: null };
  o.fit = () => {
    const w = Math.max(1, Math.round(cv.clientWidth)), hh = Math.max(1, Math.round(cv.clientHeight));
    const dpr = Math.min(window.devicePixelRatio || 1, opts.maxDpr || 2);
    if (w === o.w && hh === o.h && dpr === o.dpr) return;
    o.w = w; o.h = hh; o.dpr = dpr;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr);
    o.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (o.onresize) o.onresize(o);
  };
  o.visible = () => cv.offsetParent !== null && o.w > 2;
  o.ro = new ResizeObserver(() => o.fit());
  o.ro.observe(cv);
  o.fit();
  o.destroy = () => { o.ro.disconnect(); };
  return o;
}
function offscreen(w, hh) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(hh)); return c; }

/* ---------- sound (off by default; sets usually add sound in post) ---------- */
const Sound = {
  ctx: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  beep(freq = 1800, dur = .04, type = 'sine', vol = .05, slide = 0, delay = 0) {
    if (!S.sound) return;
    this.init(); const c = this.ctx; if (!c) return;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .03);
  },
  tap() { this.beep(2300, .025, 'square', .015); },
  open() { this.beep(520, .2, 'sine', .05, 2.4); },
  close() { this.beep(1000, .16, 'sine', .04, .35); },
  ok() { this.beep(880, .09, 'sine', .06); this.beep(1320, .16, 'sine', .06, 0, .1); },
  err() { this.beep(220, .22, 'sawtooth', .05); this.beep(150, .32, 'sawtooth', .05, 0, .2); },
  scan() { this.beep(300, .9, 'triangle', .03, 4); },
  alarm() { for (let i = 0; i < 4; i++) { this.beep(760, .22, 'square', .035, 0, i * .5); this.beep(560, .22, 'square', .035, 0, i * .5 + .25); } },
  type() { this.beep(2600 + Math.random() * 900, .012, 'square', .01); }
};

/* ---------- window manager ---------- */
const APPS = {};
const APP_ORDER = ['cif', 'orbital', 'cctv', 'aerial', 'sigint', 'bio', 'ops', 'netmap', 'archive'];

const WM = {
  wins: [], z: 20, seq: 0,
  layer() { return $('#winLayer'); },
  find(appId) { return this.wins.find(w => w.appId === appId); },
  open(appId, opts) {
    const app = APPS[appId]; if (!app) return null;
    let w = this.find(appId);
    if (w) { this.restore(w); this.focus(w); if (opts && w.inst && w.inst.onOpts) w.inst.onOpts(opts); return w; }
    const desk = UI.desk();
    const n = this.wins.length;
    const ww = Math.min(app.w || 900, desk.w - 24), wh = Math.min(app.h || 600, desk.h - 20);
    const off = (n % 5) * 26;
    let x = Math.round((desk.w - ww) / 2 + off - 52), y = Math.round((desk.h - wh) / 2 + off - 40);
    x = clamp(x, 8, Math.max(8, desk.w - ww - 8)); y = clamp(y, 6, Math.max(6, desk.h - wh - 6));
    const el = h(`<section class="win opening" role="dialog" aria-label="${esc(app.title)}">
      <header class="win-bar">${icon(app.icon, 'wi')}<span class="wt">${esc(app.title)}</span><span class="wc">${esc(app.cls || 'TS//SI')}</span><span class="sp"></span>
        <div class="wctl"><button class="mn" aria-label="Minimize">${icon('min')}</button><button class="mx" aria-label="Maximize">${icon('max')}</button><button class="x" aria-label="Close">${icon('close')}</button></div>
      </header>
      <div class="win-body"></div><div class="win-rs"></div></section>`);
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: wh + 'px' });
    w = { id: ++this.seq, appId, app, el, body: $('.win-body', el), min: false, max: !!(UI.compact || app.startMax) };
    if (w.max) el.classList.add('max');
    this.layer().appendChild(el);
    this.wins.push(w);
    this.focus(w);
    this.bind(w);
    el.addEventListener('animationend', () => el.classList.remove('opening'), { once: true });
    Sound.open();
    try { w.inst = app.create(w.body, opts || {}, w) || {}; } catch (e) { console.error(e); w.inst = {}; }
    Taskbar.render();
    $$('.dicon').forEach(d => d.classList.toggle('flag', false));
    return w;
  },
  bind(w) {
    const el = w.el, bar = $('.win-bar', el);
    $('.mn', el).onclick = e => { e.stopPropagation(); this.minimize(w); };
    $('.mx', el).onclick = e => { e.stopPropagation(); this.toggleMax(w); };
    $('.x', el).onclick = e => { e.stopPropagation(); this.close(w); };
    el.addEventListener('pointerdown', () => this.focus(w), true);
    let lastTap = 0;
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const now = performance.now();
      if (now - lastTap < 320) { this.toggleMax(w); lastTap = 0; return; }
      lastTap = now;
      if (w.max || UI.compact) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      const desk = UI.desk();
      bar.setPointerCapture(e.pointerId);
      const mv = ev => {
        const nx = clamp(ox + ev.clientX - sx, 80 - el.offsetWidth, desk.w - 80);
        const ny = clamp(oy + ev.clientY - sy, 0, desk.h - 36);
        el.style.left = nx + 'px'; el.style.top = ny + 'px';
      };
      const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
      bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
    });
    const rs = $('.win-rs', el);
    rs.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const sx = e.clientX, sy = e.clientY, ow = el.offsetWidth, oh = el.offsetHeight;
      const desk = UI.desk();
      rs.setPointerCapture(e.pointerId);
      const mv = ev => {
        el.style.width = clamp(ow + ev.clientX - sx, 320, desk.w - el.offsetLeft) + 'px';
        el.style.height = clamp(oh + ev.clientY - sy, 240, desk.h - el.offsetTop) + 'px';
      };
      const up = () => { rs.removeEventListener('pointermove', mv); rs.removeEventListener('pointerup', up); rs.removeEventListener('pointercancel', up); };
      rs.addEventListener('pointermove', mv); rs.addEventListener('pointerup', up); rs.addEventListener('pointercancel', up);
    });
  },
  focus(w) {
    if (!w) return;
    this.wins.forEach(o => o.el.classList.toggle('focus', o === w));
    w.el.style.zIndex = ++this.z;
    this.top = w;
    Taskbar.render();
  },
  minimize(w) {
    w.min = true; w.el.classList.add('min');
    const next = this.wins.filter(o => !o.min && o !== w).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
    if (next) this.focus(next); else { this.wins.forEach(o => o.el.classList.remove('focus')); this.top = null; Taskbar.render(); }
  },
  restore(w) { if (w.min) { w.min = false; w.el.classList.remove('min'); w.el.classList.add('opening'); w.el.addEventListener('animationend', () => w.el.classList.remove('opening'), { once: true }); } },
  toggleMax(w) {
    if (UI.compact) return;
    w.max = !w.max; w.el.classList.toggle('max', w.max);
    $('.mx', w.el).innerHTML = icon(w.max ? 'unmax' : 'max');
  },
  close(w) {
    if (w.closing) return;
    w.closing = true;
    Sound.close();
    w.el.classList.remove('opening'); w.el.classList.add('closing');
    const done = () => {
      try { w.inst && w.inst.destroy && w.inst.destroy(); } catch (e) { console.error(e); }
      w.el.remove();
      this.wins = this.wins.filter(o => o !== w);
      if (this.top === w) { const next = this.wins.filter(o => !o.min).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0]; if (next) this.focus(next); else this.top = null; }
      Taskbar.render();
    };
    setTimeout(done, 260);
  },
  closeAll() { this.wins.slice().forEach(w => { try { w.inst && w.inst.destroy && w.inst.destroy(); } catch (e) { /* ignore */ } w.el.remove(); }); this.wins = []; this.top = null; Taskbar.render(); },
  relayout() {
    if (!$('#desktop')) return;
    const desk = UI.desk();
    this.wins.forEach(w => {
      if (UI.compact) { w.el.classList.add('max'); return; }
      w.el.classList.toggle('max', w.max);
      const el = w.el;
      if (el.offsetWidth > desk.w) el.style.width = (desk.w - 16) + 'px';
      if (el.offsetHeight > desk.h) el.style.height = (desk.h - 12) + 'px';
      el.style.left = clamp(el.offsetLeft, 80 - el.offsetWidth, desk.w - 80) + 'px';
      el.style.top = clamp(el.offsetTop, 0, Math.max(0, desk.h - 36)) + 'px';
    });
  }
};

/* ---------- taskbar ---------- */
const Taskbar = {
  render() {
    const box = $('#tbWins'); if (!box) return;
    box.innerHTML = '';
    WM.wins.forEach(w => {
      const b = h(`<button class="tb-win${WM.top === w && !w.min ? ' focus' : ''}${w.min ? ' min' : ''}">${icon(w.app.icon)}<span>${esc(w.app.short || w.app.title)}</span></button>`);
      b.onclick = () => { if (WM.top === w && !w.min) WM.minimize(w); else { WM.restore(w); WM.focus(w); } };
      box.appendChild(b);
    });
  }
};

/* Small helper for press-and-hold interactions. */
function onHold(el, ms, fn) {
  let timer = null;
  const start = e => { clearTimeout(timer); timer = setTimeout(() => { timer = null; fn(e); }, ms); };
  const stop = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, stop));
}

/* Text that types itself out. Returns a cancel function. */
function typeOut(el, text, cps = 40, done) {
  let i = 0, acc = 0, cancelled = false;
  el.textContent = '';
  const off = Loop.add((t, dt) => {
    if (cancelled) { off(); return; }
    acc += dt * cps;
    const n = Math.floor(acc);
    if (n > 0) {
      acc -= n; i = Math.min(text.length, i + n);
      el.textContent = text.slice(0, i);
      if (n && Math.random() < .5) Sound.type();
      if (i >= text.length) { off(); if (done) done(); }
    }
  });
  return () => { cancelled = true; off(); };
}

/* Number that counts upward with jitter (for "intercepts today" style stats). */
function liveCounter(el, start, perSec) {
  let v = start, seen = false;
  const off = Loop.add((t, dt) => {
    if (el.isConnected) seen = true; else if (seen) { off(); return; }
    v += perSec * dt * (0.6 + Math.random() * .8);
    if (el.isConnected) el.textContent = fmtInt(v);
  });
  return off;
}
