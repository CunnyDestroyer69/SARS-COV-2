/* ============================================================
   Shared renderers: land masks, dotted globe, flat maps,
   portraits, fingerprints, schematic street maps, noise.
   ============================================================ */
const D2R = Math.PI / 180;

const Geo = (() => {
  const dec = b64 => { const s = atob(b64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  const W = 480, H = 240;
  const world = dec(GEO.world), worldUS = dec(GEO.worldUS), us = dec(GEO.us), usOnly = dec(GEO.usOnly);
  const bit = (a, idx) => (a[idx >> 3] >> (idx & 7)) & 1;
  const cell = (lat, lon) => { let i = Math.floor((lon + 180) / 360 * W); const j = clamp(Math.floor((90 - lat) / 180 * H), 0, H - 1); i = ((i % W) + W) % W; return j * W + i; };
  const land = (lat, lon) => bit(world, cell(lat, lon));
  const isUS = (lat, lon) => bit(worldUS, cell(lat, lon));
  const usCell = (lat, lon) => {
    const i = Math.floor((lon - GEO.usLon0) / GEO.usStep), j = Math.floor((GEO.usLat0 - lat) / GEO.usStep);
    if (i < 0 || j < 0 || i >= GEO.usW || j >= GEO.usH) return -1;
    return j * GEO.usW + i;
  };
  const usLand = (lat, lon) => { const c = usCell(lat, lon); return c < 0 ? land(lat, lon) : bit(us, c); };
  const usHome = (lat, lon) => { const c = usCell(lat, lon); return c < 0 ? 0 : bit(usOnly, c); };
  let globeCache = null;
  function globePts() {
    if (globeCache) return globeCache;
    const step = 1.25, tmp = [];
    for (let lat = -86; lat <= 86; lat += step) {
      const n = Math.max(1, Math.round(360 * Math.cos(lat * D2R) / step));
      for (let k = 0; k < n; k++) {
        const lon = -180 + (k + .5) * 360 / n;
        if (land(lat, lon)) tmp.push(Math.sin(lat * D2R), Math.cos(lat * D2R), Math.sin(lon * D2R), Math.cos(lon * D2R), isUS(lat, lon));
      }
    }
    globeCache = new Float32Array(tmp);
    return globeCache;
  }
  return { land, isUS, usLand, usHome, globePts };
})();

/* ---------- dotted orthographic globe ---------- */
class Globe {
  constructor(o = {}) {
    this.lat0 = o.lat0 ?? 28; this.lon0 = o.lon0 ?? -70; this.spin = o.spin ?? 4; this.zoom = 1;
    this.pts = Geo.globePts();
    this.buckets = [[], [], [], []];
  }
  prep() { this.s0 = Math.sin(this.lat0 * D2R); this.c0 = Math.cos(this.lat0 * D2R); this.sl0 = Math.sin(this.lon0 * D2R); this.cl0 = Math.cos(this.lon0 * D2R); }
  /* unit-sphere coords: x right, y up, z toward viewer */
  proj(lat, lon, r = 1) {
    const sp = Math.sin(lat * D2R), cp = Math.cos(lat * D2R);
    const dl = (lon - this.lon0) * D2R, cdl = Math.cos(dl);
    return [cp * Math.sin(dl) * r, (this.c0 * sp - this.s0 * cp * cdl) * r, (this.s0 * sp + this.c0 * cp * cdl) * r];
  }
  /* is a projected point hidden behind the earth disc */
  hidden(p) { return p[2] < 0 && (p[0] * p[0] + p[1] * p[1]) < 1; }
  draw(ctx, cx, cy, R, o = {}) {
    this.prep();
    const A = THEME.acc, A2 = THEME.acc2;
    const g = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R);
    g.addColorStop(0, rgba(A, .2)); g.addColorStop(.7, rgba(A, .06)); g.addColorStop(1, rgba(A, .02));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = rgba(A, .65); ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = rgba(A, .14); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R + 4, 0, Math.PI * 2); ctx.stroke();
    // graticule
    if (o.grid !== false) {
      ctx.strokeStyle = rgba(A, .13); ctx.lineWidth = 1;
      ctx.beginPath();
      for (let lat = -60; lat <= 60; lat += 30) this._line(ctx, cx, cy, R, k => [lat, -180 + k * 4], 91);
      for (let lon = -180; lon < 180; lon += 30) this._line(ctx, cx, cy, R, k => [-90 + k * 3, lon], 61);
      ctx.stroke();
    }
    // land dots
    const P = this.pts, b = this.buckets; b[0].length = b[1].length = b[2].length = b[3].length = 0;
    const s0 = this.s0, c0 = this.c0, sl0 = this.sl0, cl0 = this.cl0;
    const usP = [];
    for (let i = 0; i < P.length; i += 5) {
      const sp = P[i], cp = P[i + 1], sl = P[i + 2], cl = P[i + 3];
      const cdl = cl * cl0 + sl * sl0;
      const z = s0 * sp + c0 * cp * cdl;
      if (z <= 0.02) continue;
      const sdl = sl * cl0 - cl * sl0;
      const x = cx + cp * sdl * R, y = cy - (c0 * sp - s0 * cp * cdl) * R;
      if (P[i + 4]) usP.push(x, y);
      else b[z > .75 ? 3 : z > .5 ? 2 : z > .25 ? 1 : 0].push(x, y);
    }
    const ds = Math.max(1.3, R * .0105), hs = ds / 2;
    const alphas = [.28, .5, .72, .92];
    for (let k = 0; k < 4; k++) {
      const arr = b[k]; if (!arr.length) continue;
      ctx.fillStyle = rgba(A, alphas[k]); ctx.beginPath();
      for (let j = 0; j < arr.length; j += 2) ctx.rect(arr[j] - hs, arr[j + 1] - hs, ds, ds);
      ctx.fill();
    }
    if (usP.length) {
      ctx.fillStyle = rgba(o.homeColor || A2, .95); ctx.beginPath();
      for (let j = 0; j < usP.length; j += 2) ctx.rect(usP[j] - hs, usP[j + 1] - hs, ds, ds);
      ctx.fill();
    }
    // terminator-style rim shading
    const sh = ctx.createRadialGradient(cx, cy, R * .55, cx, cy, R);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  }
  _line(ctx, cx, cy, R, f, n) {
    let pen = false;
    for (let k = 0; k < n; k++) {
      const [la, lo] = f(k); const p = this.proj(la, lo);
      if (p[2] > 0) { const x = cx + p[0] * R, y = cy - p[1] * R; if (pen) ctx.lineTo(x, y); else ctx.moveTo(x, y); pen = true; } else pen = false;
    }
  }
  /* screen point for lat/lon (+altitude factor), with visibility */
  screen(cx, cy, R, lat, lon, r = 1) { const p = this.proj(lat, lon, r); return { x: cx + p[0] * R, y: cy - p[1] * R, z: p[2], hid: this.hidden(p) }; }
}

/* Satellite position (lat, lon) at time t (seconds). Display radius factor r. */
function satState(s, t) {
  if (s.geoLon != null) return { lat: 0, lon: s.geoLon, r: satRadius(s.alt) };
  const period = 36 * Math.pow((6371 + s.alt) / 6871, 1.5); // display seconds per orbit
  const u = s.ph + t * 2 * Math.PI / period;
  const inc = s.inc * D2R;
  const lat = Math.asin(Math.sin(inc) * Math.sin(u)) / D2R;
  const lon = s.raan + Math.atan2(Math.cos(inc) * Math.sin(u), Math.cos(u)) / D2R - t * 1.2;
  return { lat, lon: ((lon + 540) % 360) - 180, r: satRadius(s.alt), u, period };
}
function satRadius(alt) { return 1.07 + .42 * (1 - Math.exp(-alt / 8000)); }
function satOrbit(s, t, n = 96) {
  const pts = [];
  if (s.geoLon != null) { for (let k = 0; k <= n; k++) pts.push([0, -180 + k * 360 / n]); return pts; }
  const st = satState(s, t);
  for (let k = 0; k <= n; k++) {
    const dt = (k / n) * st.period;
    const q = satState(s, t + dt);
    pts.push([q.lat, q.lon]);
  }
  return pts;
}

/* ---------- flat maps (pre-rendered dot fields) ---------- */
function flatWorld(w, hh, o = {}) {
  const latT = o.latT ?? 80, latB = o.latB ?? -58;
  const sx = w / 360, sy = hh / (latT - latB);
  const s = Math.min(sx, sy);
  const mw = 360 * s, mh = (latT - latB) * s, ox = (w - mw) / 2, oy = (hh - mh) / 2;
  const proj = (lat, lon) => [ox + (lon + 180) * s, oy + (latT - lat) * s];
  const unproj = (x, y) => [latT - (y - oy) / s, (x - ox) / s - 180];
  const c = offscreen(w * (o.dpr || 1), hh * (o.dpr || 1)), ctx = c.getContext('2d');
  ctx.scale(o.dpr || 1, o.dpr || 1);
  const step = o.step || Math.max(4, Math.round(mw / 150));
  const A = THEME.acc, A2 = THEME.acc2;
  const r = step * (o.dot || .3);
  for (let y = oy + step / 2; y < oy + mh; y += step) {
    for (let x = ox + step / 2; x < ox + mw; x += step) {
      const [lat, lon] = unproj(x, y);
      if (!Geo.land(lat, lon)) continue;
      const home = Geo.isUS(lat, lon);
      ctx.fillStyle = home ? rgba(A2, o.homeA ?? .75) : rgba(A, o.landA ?? .42);
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }
  if (o.grid !== false) {
    ctx.strokeStyle = rgba(A, .08); ctx.lineWidth = 1; ctx.beginPath();
    for (let lon = -180; lon <= 180; lon += 30) { const [x] = proj(0, lon); ctx.moveTo(x, oy); ctx.lineTo(x, oy + mh); }
    for (let lat = -30; lat <= 60; lat += 30) { const [, y] = proj(lat, 0); ctx.moveTo(ox, y); ctx.lineTo(ox + mw, y); }

function tintPhoto(ctx, img, W, H) {

  for (let i = 0; i < d.length; i += 4) {

/* ---------- schematic street map ---------- */
const schemCache = new Map();
function schematic(seed, W, H) {
  const key = seed + ':' + W + 'x' + H + ':' + THEME.acc.join(',');
  if (schemCache.has(key)) return schemCache.get(key);
  const r = rng(seed), A = THEME.acc, c = offscreen(W, H), ctx = c.getContext('2d');
  ctx.fillStyle = 'rgb(4,11,17)'; ctx.fillRect(0, 0, W, H);
  const ang = (r() - .5) * .5;
  // river
  ctx.save();
  ctx.strokeStyle = rgba(A, .12); ctx.lineWidth = Math.max(14, W * .05); ctx.lineCap = 'round';
  ctx.beginPath(); const ry = H * (.25 + r() * .5);
  ctx.moveTo(-20, ry); ctx.bezierCurveTo(W * .3, ry - H * .3 * (r() - .3), W * .6, ry + H * .35 * (r() - .3), W + 20, ry + (r() - .5) * H * .4); ctx.stroke();
  ctx.restore();
  // parks
  for (let k = 0; k < 3; k++) {
    const px = r() * W * .8, py = r() * H * .8, pw = W * (.08 + r() * .1), ph = H * (.08 + r() * .1);
    ctx.fillStyle = rgba(A, .05); ctx.fillRect(px, py, pw, ph);
    ctx.save(); ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
    ctx.strokeStyle = rgba(A, .1); ctx.lineWidth = 1; ctx.beginPath();
    for (let x = -ph; x < pw; x += 6) { ctx.moveTo(px + x, py + ph); ctx.lineTo(px + x + ph, py); }
    ctx.stroke(); ctx.restore();
  }
  // street grid
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(ang); ctx.translate(-W / 2, -H / 2);
  const gs = Math.max(18, W / 18);
  ctx.strokeStyle = rgba(A, .16); ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -W; x < W * 2; x += gs * (.7 + r() * .6)) { ctx.moveTo(x, -H); ctx.lineTo(x, H * 2); }
  for (let y = -H; y < H * 2; y += gs * (.7 + r() * .6)) { ctx.moveTo(-W, y); ctx.lineTo(W * 2, y); }
  ctx.stroke();
  ctx.restore();
  // arterials
  ctx.strokeStyle = rgba(A, .4); ctx.lineWidth = 2.2; ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    if (k % 2) { const y0 = r() * H; ctx.moveTo(0, y0); ctx.bezierCurveTo(W * .3, y0 + (r() - .5) * H * .3, W * .7, y0 + (r() - .5) * H * .3, W, r() * H); }
    else { const x0 = r() * W; ctx.moveTo(x0, 0); ctx.bezierCurveTo(x0 + (r() - .5) * W * .3, H * .3, x0 + (r() - .5) * W * .3, H * .7, r() * W, H); }
  }
  ctx.stroke();
  // labels
  ctx.fillStyle = rgba(A, .35); ctx.font = `${Math.max(8, Math.round(W / 70))}px "Share Tech Mono", monospace`;
  for (let k = 0; k < 6; k++) ctx.fillText(pick(r, STREETS).toUpperCase(), r() * W * .85, 12 + r() * (H - 20));
  if (schemCache.size > 30) schemCache.clear();
  schemCache.set(key, c);
  return c;
}

/* Small helpers for canvas HUD text. */
function hudText(ctx, txt, x, y, o = {}) {
  ctx.font = `${o.weight || 400} ${o.size || 11}px ${o.font || '"Share Tech Mono", monospace'}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
  if (o.bg) { const m = ctx.measureText(txt); const pw = m.width + 8, ph = (o.size || 11) + 6; let bx = x - 4; if (o.align === 'center') bx = x - pw / 2; if (o.align === 'right') bx = x - pw + 4; ctx.fillStyle = o.bg; ctx.fillRect(bx, y - (o.size || 11) - 1, pw, ph); }

}
function brackets(ctx, x, y, w, hh, len, col, lw = 1.5) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();

  ctx.moveTo(x + w, y + hh - len); ctx.lineTo(x + w, y + hh); ctx.lineTo(x + w - len, y + hh);

const Cue = {

  clear() {
    Object.keys(this.live).forEach(k => this.kill(k));

    const al = $('#alvl'); if (al) $$('i', al).forEach((i, k) => { i.className = k < 3 ? 'on' : ''; });
    const wl = $('#wgLevel'); if (wl) { wl.textContent = 'ELEVATED'; wl.style.color = ''; }

  box(name, cls, sub, main, foot, ms) {

    this.fx().appendChild(el);

  signal() {

  }
};

    const cnt = $('#drCount', d); cnt.addEventListener('input', () => { S.countdown = clamp(parseInt(cnt.value, 10) || 30, 3, 3600); saveSettings(); });
    $('#drMatch', d).onchange = e => { S.matchSubject = e.target.value; saveSettings(); };
    $$('[data-act]', d).forEach(b => b.onclick = () => this.act(b.dataset.act));
  },
  close() { const d = $('#director'); if (d) d.remove(); },
  fire(name) {
    if (name === 'clear') return Cue.clear();
    if (name === 'countdown') return Cue.countdown(S.countdown);
    if (Cue[name]) Cue[name]();
  },
  note(t) { const n = $('#drMsgLine'); if (n) n.textContent = t; },
  act(a) {
    if (a === 'resetSubj') { Store.del('subjects'); this.note('Subject edits cleared. Reloading…'); setTimeout(() => location.reload(), 600); return; }
    if (a === 'resetAll') { ['settings', 'subjects', 'hintSeen'].forEach(k => Store.del(k)); this.note('Everything reset. Reloading…'); setTimeout(() => location.reload(), 600); return; }
    if (a === 'closeAll') { WM.closeAll(); return; }
    if (a === 'fullscreen') {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => this.note('Full screen is not available here. On iPad, use Share → Add to Home Screen, or Guided Access.')); } catch (e) { this.note('Full screen is not available here.'); } }
      else this.note('Full screen is not available here. On iPad, use Share → Add to Home Screen, or Guided Access.');
      return;
    }
    this.close();
    Session[a]();
  }
};

document.addEventListener('keydown', e => {
  if (e.key === '`' && !e.target.closest('input,textarea,[contenteditable="true"]')) { $('#director') ? Director.close() : Director.open(); return; }
  if ((e.ctrlKey || e.metaKey) && /^[0-9]$/.test(e.key)) {
    e.preventDefault();
    const n = parseInt(e.key, 10);
    if (n === 0) Cue.clear(); else if (CUE_LIST[n - 1]) Director.fire(CUE_LIST[n - 1][0]);
  }
});

const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
function fmtDT(t, withYear) { const d = new Date(t - 4 * 3600e3); return `${pad(d.getUTCDate())} ${MON[d.getUTCMonth()]}${withYear ? ' ' + d.getUTCFullYear() : ''} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function fmtDur(s) { return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; }
function redactHTML(text) {
  return esc(text).replace(/\[\[(.+?)\]\]/g, (m, inner) => `<span class="redact tap" data-r="${esc(inner)}">${'█'.repeat(Math.min(18, Math.max(6, inner.length)))}</span>`);
}
function bindRedactions(root) {
  root.addEventListener('click', e => {
    const r = e.target.closest('.redact.tap'); if (!r || UI.editMode) return;
    if (r.classList.contains('open')) { r.classList.remove('open'); r.textContent = '█'.repeat(Math.min(18, Math.max(6, r.dataset.r.length))); return; }
    scramble(r, r.dataset.r); r.classList.add('open'); Sound.ok();
  });
}
function scramble(el, txt, ms = 700) {
  const chars = '█▓▒░#%&@$ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const t0 = performance.now();
  const off = Loop.add(() => {
    const p = clamp((performance.now() - t0) / ms, 0, 1), n = Math.floor(p * txt.length);
    let s = txt.slice(0, n); for (let i = n; i < txt.length; i++) s += txt[i] === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)];
    el.textContent = s; if (p >= 1) off();
  });
}
function threatColor(v) { return v >= 80 ? THEME.alert : v >= 55 ? THEME.warn : v >= 25 ? THEME.acc : THEME.ok; }

      // portrait with face-mesh scan

      offs.push(() => PC.destroy());

        if (!PC.visible()) return;
        const ctx = PC.ctx, w = PC.w, hh = PC.h;
        const base = portrait(s, Math.round(w * PC.dpr), Math.round(hh * PC.dpr));
        ctx.drawImage(base, 0, 0, w, hh);
        const p = animate ? clamp((t - t0) / 1.8, 0, 1) : 1;
        const sz = Math.min(w, hh / 1.2), ox = (w - sz) / 2, oy = (hh - sz * 1.2) / 2;
        const X = v => ox + v * sz, Y = v => oy + v * sz;
        const nE = Math.floor(mesh.edges.length * p);
        ctx.strokeStyle = rgba(THEME.acc2, p < 1 ? .7 : .28); ctx.lineWidth = 1; ctx.beginPath();

        ctx.stroke();
        const nP = Math.floor(mesh.pts.length * p);

        for (let i = 0; i < nP; i++) ctx.fillRect(X(mesh.pts[i][0]) - 1.5, Y(mesh.pts[i][1]) - 1.5, 3, 3);
        const sy = p < 1 ? hh * p : (hh * ((t * .25) % 1));
        ctx.fillStyle = rgba(THEME.acc, .5); ctx.fillRect(0, sy, w, 1.5);
        const g = ctx.createLinearGradient(0, sy - 30, 0, sy); g.addColorStop(0, rgba(THEME.acc, 0)); g.addColorStop(1, rgba(THEME.acc, .14)); ctx.fillStyle = g; ctx.fillRect(0, sy - 30, w, 30);
        brackets(ctx, 4, 4, w - 8, hh - 8, 12, rgba(THEME.acc, .9), 2);
        hudText(ctx, p < 1 ? `MAPPING ${Math.floor(p * 68)}/68` : 'IDENTITY CONFIRMED', 9, 18, { size: 10, bg: 'rgba(0,0,0,.6)', color: p < 1 ? rgba(THEME.warn, 1) : rgba(THEME.ok, 1) });
      }));
      // gauge
      const GC = makeCanvas($('.cf-gv', file));
      offs.push(() => GC.destroy());
      const g0 = performance.now() / 1000;
      offs.push(Loop.add((t) => {
        if (!GC.visible()) return;
        const ctx = GC.ctx, w = GC.w, hh = GC.h; ctx.clearRect(0, 0, w, hh);

        const cx = w / 2, cy = hh / 2 + 4, R = Math.min(w, hh) * .4;

        ctx.lineWidth = 9; ctx.strokeStyle = rgba(THEME.acc, .12); ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
        const col = threatColor(v);
        const segs = 30;
        for (let i = 0; i < segs; i++) {
          const f0 = i / segs; if (f0 * 100 > v) break;

function geoCircle(lat, lon, rad, n = 40) {
  const out = [], φ1 = lat * D2R, λ1 = lon * D2R, δ = rad * D2R;
  for (let k = 0; k <= n; k++) {
    const θ = k / n * 2 * Math.PI;
    const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
    const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
    out.push([φ2 / D2R, λ2 / D2R]);
  }
  return out;
}

function cctvPost(ctx, w, h, t, cam, o) {

  if (Math.sin(t * .7 + cam.seed) > .985) { const by = (t * 300) % h; ctx.drawImage(ctx.canvas, 0, by * (ctx.canvas.height / h), ctx.canvas.width, 12 * (ctx.canvas.height / h), 6, by, w, 12); }

  hudText(ctx, `${cam.id} // ${cam.name}`, 10, fs + 8, { size: fs, bg: 'rgba(0,0,0,.55)', color: 'rgba(235,240,240,.95)' });
  hudText(ctx, ts, 10, h - 10, { size: fs, bg: 'rgba(0,0,0,.55)', color: 'rgba(235,240,240,.95)' });
  if (Math.floor(t * 1.4) % 2 === 0) { ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(w - 44, fs + 3, fs * .38, 0, 6.283); ctx.fill(); }

function drawDets(ctx, sc, o) {

    const tgt = d.a.target, sel = o.sel === d.a;

    const off = Loop.add((t, dt) => {

      }
      const speaking = play && !play.paused && play.el ? cur.lines[play.i][0] : null;
      ampA = lerp(ampA, speaking === 'A' ? 1 : .05, .15); ampB = lerp(ampB, speaking === 'B' ? 1 : .05, .15);
      acc += dt; if (acc < 1 / 30) return; acc = 0;

      if (SC.visible()) {
        const ctx = SC.ctx, w = SC.w, hh = SC.h, sh = Math.round(hh * .42);
        const N = Math.max(64, Math.floor(w / 3));
        const vals = new Float32Array(N);
        peaks.forEach(p => { p.f += p.d * dt * 30; if (p.f < .03 || p.f > .97) p.d *= -1; });
        for (let i = 0; i < N; i++) {
          const f = i / N; let v = .08 + Math.random() * .07;
          peaks.forEach((p, k) => { v += p.a * (k === 3 && speaking ? 1.3 : 1) * Math.exp(-((f - p.f) ** 2) / (2 * p.w * p.w)) * (.75 + Math.random() * .3); });
          vals[i] = Math.min(1, v);
        }
        if (!hold || hold.length !== N) hold = new Float32Array(N);
        for (let i = 0; i < N; i++) hold[i] = Math.max(vals[i], hold[i] - dt * .4);
        ctx.fillStyle = '#02070b'; ctx.fillRect(0, 0, w, sh);
        ctx.strokeStyle = rgba(THEME.acc, .08); ctx.lineWidth = 1; ctx.beginPath();
        for (let x = 0; x < w; x += w / 10) { ctx.moveTo(x, 0); ctx.lineTo(x, sh); } for (let y = 0; y < sh; y += sh / 4) { ctx.moveTo(0, y); ctx.lineTo(w, y); } ctx.stroke();
        const bw = w / N;
        for (let i = 0; i < N; i++) { const v = vals[i]; ctx.fillStyle = rgba(v > .75 ? THEME.warn : THEME.acc, .35 + v * .6); ctx.fillRect(i * bw, sh - v * (sh - 14), Math.max(1, bw - 1), v * (sh - 14)); }
        ctx.strokeStyle = rgba(THEME.acc2, .9); ctx.beginPath(); for (let i = 0; i < N; i++) { const y = sh - hold[i] * (sh - 14); i ? ctx.lineTo(i * bw, y) : ctx.moveTo(0, y); } ctx.stroke();
        const mx = peaks[3].f * w; ctx.strokeStyle = rgba(THEME.alert, .9); ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, sh); ctx.stroke(); ctx.setLineDash([]);
        hudText(ctx, `CH 41 · ${(1710 + peaks[3].f * 170).toFixed(2)} MHz · ${speaking ? 'ACTIVE' : 'CARRIER'}`, Math.min(mx + 6, w - 230), 14, { size: 10.5, bg: 'rgba(0,0,0,.6)', color: rgba(THEME.alert, 1) });
        hudText(ctx, 'SPECTRUM 1710–1880 MHz · RBW 30 kHz', 8, 14, { size: 10.5, color: rgba(THEME.acc2, .8) });
        // waterfall
        const wy = sh + 1, wh = hh - wy;
        const dpr = SC.dpr, pw = Math.round(w * dpr), ph = Math.max(1, Math.round(wh * dpr));
        if (!wf || wf.width !== pw || wf.height !== ph) { wf = offscreen(pw, ph); wfImg = wf.getContext('2d').createImageData(pw, 1); }
        const wctx = wf.getContext('2d');
        wctx.drawImage(wf, 0, 1);
        const d = wfImg.data;
        for (let x = 0; x < pw; x++) { const v = vals[Math.min(N - 1, Math.floor(x / pw * N))]; const li = Math.min(255, Math.floor(v * 255)) * 3; d[x * 4] = lut[li]; d[x * 4 + 1] = lut[li + 1]; d[x * 4 + 2] = lut[li + 2]; d[x * 4 + 3] = 255; }
        wctx.putImageData(wfImg, 0, 0);
        ctx.drawImage(wf, 0, wy, w, wh);
        ctx.fillStyle = rgba(THEME.acc, .5); ctx.fillRect(0, sh, w, 1);
        hudText(ctx, 'WATERFALL · 30 S', 8, wy + 14, { size: 10.5, bg: 'rgba(0,0,0,.5)', color: rgba(THEME.acc2, .8) });
      }
      // waveform
      if (WC.visible()) {
        const ctx = WC.ctx, w = WC.w, hh = WC.h;
        ctx.fillStyle = '#02070b'; ctx.fillRect(0, 0, w, hh);

          ctx.strokeStyle = rgba(col, .95); ctx.lineWidth = 1.2; ctx.beginPath();

            const env = Math.sin(x / w * Math.PI) * (.4 + .6 * Math.abs(Math.sin(x * .021 + t * 7.3)));
            const y = cy + amp * hh * .2 * env * (Math.sin(x * .31 + t * 40) * .6 + Math.sin(x * .093 - t * 23) * .4 + (Math.random() - .5) * .6);

      }
      // trace
      if (traceSt && traceSt.TC.visible()) {
        const T = traceSt, ctx = T.TC.ctx, w = T.TC.w, hh = T.TC.h, el = performance.now() / 1000 - T.t0;

        const p = clamp(el / 4.2, 0, 1), fx = T.fix[0] * w, fy = T.fix[1] * hh;

          hudText(ctx, `TWR ${String.fromCharCode(65 + i)}`, x + 9, y + 4, { size: 10, bg: 'rgba(0,0,0,.6)', color: rgba(THEME.acc2, 1) });
        });
        const errKm = 2.4 * Math.pow(1 - p, 2.2) + .012;
        if (p > .35) { const pp = (el * 1.5) % 1; ctx.strokeStyle = rgba(THEME.alert, 1 - pp); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx, fy, 5 + pp * 30, 0, Math.PI * 2); ctx.stroke(); }
        if (p >= 1) { brackets(ctx, fx - 18, fy - 18, 36, 36, 8, rgba(THEME.alert, 1), 2); hudText(ctx, T.place, fx + 24, fy - 8, { size: 12, bg: 'rgba(40,0,0,.8)', color: rgba(THEME.alert, 1) }); }
        const st = $('.tr-st', trace), ac = $('.tr-acc', trace);
        if (ac) ac.textContent = errKm >= 1 ? `±${errKm.toFixed(2)} KM` : `±${Math.round(errKm * 1000)} M`;
        if (st) st.textContent = p < 1 ? `TRIANGULATING ${Math.floor(p * 100)}%` : 'LOCATION ACQUIRED';
        if (p >= 1 && !T.done) { T.done = true; st.classList.add('ok'); $('.tr-act', trace).hidden = false; Sound.ok(); }
      }
    });
    renderList();
    load(INTERCEPTS.find(i => i.id === opts.intercept) || INTERCEPTS[0], true);
    return {
      onOpts(o) { if (o.intercept) load(INTERCEPTS.find(i => i.id === o.intercept) || INTERCEPTS[0], true); },
      destroy() { off(); offT(); SC.destroy(); WC.destroy(); if (traceSt) traceSt.TC.destroy(); }
    };
  }
};

    return { onOpts(o) { if (o.subject && byId[o.subject]) { sel = byId[o.subject]; path = null; renderInfo(); } }, destroy() { off(); C.destroy(); } };
  }
};

/* ============================================================
   CLASSIFIED ARCHIVE — browsable fictional document reader
   ============================================================ */
APPS.archive = {
  title: 'Classified Archive', short: 'Archive', icon: 'archive', code: 'DOC-VAULT', w: 1000, h: 660, cls: 'TS//ORCON',
  create(body, opts, win) {
    const root = h(`<div class="ar">
      <aside class="ar-list panel"><div class="panel-h">Document vault<span class="sp"></span><span class="mono">${DOCS.length}</span></div>
        <label class="ar-q">${icon('search')}<input class="field-in" placeholder="Search vault" autocomplete="off"></label>
        <div class="ar-items scroll"></div></aside>
      <div class="ar-doc"><button class="btn sm ar-back" hidden>${icon('chevL')}Vault</button><div class="ar-paper scroll"></div></div>
    </div>`);
    body.appendChild(root);
    const items = $('.ar-items', root), paper = $('.ar-paper', root), q = $('.ar-q input', root);
    let cur = null, revealed = false;
    const matches = () => { const v = q.value.toUpperCase(); return DOCS.filter(d => !v || (d.title + d.sub + d.body.join(' ')).toUpperCase().includes(v)); };
    const renderList = () => {
      items.innerHTML = matches().map(d => `<button class="ar-item${cur === d ? ' on' : ''}" data-id="${d.id}"><span class="ai-stamp">${esc(d.stamp)}</span><b>${esc(d.title)}</b><small>${esc(d.sub)}</small><span class="mono dim">${esc(d.date)} · ${esc(d.id)}</span></button>`).join('') || '<div class="ar-empty mono">NO DOCUMENTS MATCH</div>';
      $$('.ar-item', items).forEach(b => b.onclick = () => { open(DOCS.find(d => d.id === b.dataset.id)); root.classList.add('reading'); });
    };
    const open = d => {
      cur = d; revealed = false; renderList();
      paper.scrollTop = 0;
      paper.innerHTML = `<article class="doc">
        <div class="doc-cls">${esc(S.classification)}</div>
        <header class="doc-head">
          <div class="doc-seal">${emblem(true)}</div>
          <div class="doc-meta">
            <div class="doc-stamp">${esc(d.stamp)}</div>
            <h1>${esc(d.title)}</h1><h2>${esc(d.sub)}</h2>
            <dl class="doc-kv"><dt>FROM</dt><dd>${esc(d.from)}</dd><dt>TO</dt><dd>${esc(d.to)}</dd><dt>DATE</dt><dd>${esc(d.date)}</dd><dt>CLASS</dt><dd>${esc(d.level)}</dd><dt>DOC ID</dt><dd>${esc(d.id)}-${pad(hash(d.id) % 9999, 4)}</dd></dl>
          </div>
        </header>
        <div class="doc-ctl"><button class="btn sm" data-reveal>Reveal redactions</button><span class="mono dim">${d.body.join(' ').match(/\[\[/g) ? (d.body.join(' ').match(/\[\[/g).length + ' REDACTIONS') : 'NO REDACTIONS'} · READ-ONLY</span></div>
        <div class="doc-body">${d.body.map((p, i) => `<p>${redactHTML(p)}</p>`).join('')}</div>
        <footer class="doc-foot"><div class="doc-sig"><span class="mono">AUTHENTICATED</span><div class="doc-qr"></div></div><div class="mono dim">THIS DOCUMENT IS TRACKED. PRINTING AND EXFILTRATION ARE LOGGED UNDER DIRECTIVE 41-C.<br>ACCESSED BY ${esc(S.operator)} (${esc(S.operatorId)}) · ${tzTime('UTC')}Z</div></footer>
        <div class="doc-cls">${esc(S.classification)}</div>
      </article>`;
      bindRedactions(paper);
      drawQR($('.doc-qr', paper), hash(d.id));
      const rb = $('[data-reveal]', paper);
      rb.onclick = () => {
        revealed = !revealed;
        $$('.redact', paper).forEach(r => { if (revealed && !r.classList.contains('open')) { scramble(r, r.dataset.r); r.classList.add('open'); } else if (!revealed) { r.classList.remove('open'); r.textContent = '█'.repeat(Math.min(18, Math.max(6, r.dataset.r.length))); } });
        rb.textContent = revealed ? 'Hide redactions' : 'Reveal redactions'; rb.classList.toggle('on', revealed);
        Sound[revealed ? 'ok' : 'tap']();
      };
    };
    const drawQR = (el, seed) => {
      const n = 21, r = rng(seed), c = offscreen(n, n), x = c.getContext('2d');
      x.fillStyle = '#d3ebf6'; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (r() < .5) x.fillRect(i, j, 1, 1);

    q.addEventListener('input', renderList);
    renderList();
    open(DOCS.find(d => d.id === opts.doc) || DOCS[0]);
    return { onOpts(o) { if (o.doc) { open(DOCS.find(d => d.id === o.doc) || DOCS[0]); root.classList.add('reading'); } }, destroy() {} };
  }
};

/* ============================================================
   Start-up
   ============================================================ */
function init() {
  try { $('#grain').style.backgroundImage = `url(${getNoiseTiles()[0].toDataURL()})`; } catch (e) { /* ignore */ }
  applyTheme();
  window.addEventListener('resize', () => { UI.updateCompact(); WM.relayout(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
  document.addEventListener('pointerdown', e => { if (e.target.closest('button')) Sound.tap(); }, true);
  if (navigator.wakeLock) {
    const req = () => { try { navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* ignore */ } };
    req(); document.addEventListener('visibilitychange', () => { if (!document.hidden) req(); });
  }
  const hash = (location.hash || '').slice(1);
  if (hash === 'desktop' || APPS[hash]) { Login.enter(); if (APPS[hash]) setTimeout(() => WM.open(hash), 300); }
  else if (hash === 'login' || !S.boot) Login.show();
  else Boot.run();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
