<title>Star's Wand Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An unofficial Star vs. the Forces of Evil fan game: Star and Marco battle Ludo's monsters, Buff Frog, Ludo and Toffee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one letterboxed 16:9 game canvas floating in the purple space between dimensions.
   Single dark visual world by choice (the game paints its own scenes). */
:root {
  --void: #1b1030;
  --void-2: #2c174d;
  --rim: #3d2566;
  --ink: #f6eefe;
  --star: #ffd84a;
  --display: "Gluten", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--void); }
body {
  height: 100%;
  margin: 0;
  box-sizing: border-box;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, var(--void-2), var(--void) 72%) var(--void);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
#wrap { width: 100%; height: 100%; display: grid; place-items: center; }
#game {
  display: block;
  border-radius: 10px;
  background: #120a22;
  box-shadow: 0 0 0 2px var(--rim), 0 20px 60px rgba(0, 0, 0, .5);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
#game:focus-visible { box-shadow: 0 0 0 3px var(--star), 0 20px 60px rgba(0, 0, 0, .5); }
</style>
<main id="wrap">
  <canvas id="game" tabindex="0" aria-label="Star's Wand Quest, a platform game. Arrow keys or A and D move, Space jumps, X casts or attacks, Q and E switch spells, C swaps between Star and Marco, V casts Warnicorn Stampede, Escape pauses."></canvas>
</main>

//  levels: built with a tiny stamping API (tile coords)
//  tiles:  # ground  X wall  = one-way  B barricade  D gate
//          ^ v spikes  * jelly bounce  ~ swamp  c crumble cloud
//  things: @ start  E portal  K checkpoint  o sparkle  H nachos  P pudding  R rune  M captive Marco
//          b Three-Eyed Potato Baby  m Boo Fly  s Spikeballs  k Lobster Claws  t Bearicorn
//          F Buff Frog  U Ludo  T Toffee
// ============================================================
const TILE_CHARS = '#X=BD^v*~c';
function makeLevel(def) {
  const g = Array.from({ length: def.h }, () => Array(def.w).fill(' '));
  const ents = [];
  const L = {
    fill(x0, y0, x1, y1, ch = '#') {
      for (let y = Math.max(0, y0); y <= Math.min(def.h - 1, y1); y++)
        for (let x = Math.max(0, x0); x <= Math.min(def.w - 1, x1); x++) g[y][x] = ch;
    },
    ground(x0, x1, top, ch = '#') { this.fill(x0, top, x1, def.h - 1, ch); },
    plat(x0, x1, y) { this.fill(x0, y, x1, y, '='); },
    put(x, y, ch) { if (TILE_CHARS.includes(ch)) { if (y >= 0 && y < def.h && x >= 0 && x < def.w) g[y][x] = ch; } else ents.push({ type: ch, x, y }); },
    row(x, y, str) { for (let i = 0; i < str.length; i++) if (str[i] !== ' ') this.put(x + i, y, str[i]); },
    sign(x, y, text) { ents.push({ type: '!', x, y, text }); },
    mover(x, y, axis, range, period = 3, phase = 0) { ents.push({ type: 'mover', x, y, axis, range, period, phase }); }
  };
  def.build(L);
  return Object.assign({}, def, { grid: g, ents });
}

// ------------------------------------------------------------ tiles
function tAt(tx, ty) { if (tx < 0 || tx >= G.w) return 'X'; if (ty < 0 || ty >= G.h) return ' '; return G.grid[ty][tx]; }
function isSolid(ch) { return ch === '#' || ch === 'X' || ch === 'B' || ch === 'D' || ch === '*' || ch === 'Q'; }
function crumbleSolid(tx, ty) { const c = G.crumbles.get(ty * G.w + tx); return !c || c.state < 2; }
function isOneWay(ch, tx, ty) { return ch === '=' || (ch === 'c' && crumbleSolid(tx, ty)); }
function moveX(b, dx) {
  if (!dx) return 0;
  b.x += dx;
  const y0 = Math.floor(b.y / TS), y1 = Math.floor((b.y + b.h - 0.01) / TS);
  if (dx > 0) {
    const tx = Math.floor((b.x + b.w - 0.01) / TS);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tAt(tx, ty))) { b.x = tx * TS - b.w; return 1; }
  } else {
    const tx = Math.floor(b.x / TS);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tAt(tx, ty))) { b.x = (tx + 1) * TS; return -1; }
  }
  return 0;
}
function moveY(b, dy, noOneWay) {
  if (!dy) return null;
  const prevBottom = b.y + b.h;
  b.y += dy;
  const x0 = Math.floor(b.x / TS), x1 = Math.floor((b.x + b.w - 0.01) / TS);
  if (dy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / TS);
    let hits = null;
    for (let tx = x0; tx <= x1; tx++) {
      const ch = tAt(tx, ty);
      if (isSolid(ch) || (!noOneWay && isOneWay(ch, tx, ty) && prevBottom <= ty * TS + 0.5)) (hits || (hits = [])).push({ ch, tx, ty });
    }
    if (hits) { b.y = ty * TS - b.h; return { hit: 'floor', tiles: hits }; }
    if (!noOneWay && b.movers !== false) for (const m of G.movers) {
      if (b.x + b.w > m.x + 1 && b.x < m.x + m.w - 1 && prevBottom <= Math.max(m.y, m.prevY) + 1 && b.y + b.h >= m.y) { b.y = m.y - b.h; return { hit: 'floor', tiles: [], mover: m }; }
    }
  } else {
    const ty = Math.floor(b.y / TS);
    for (let tx = x0; tx <= x1; tx++) if (isSolid(tAt(tx, ty))) { b.y = (ty + 1) * TS; return { hit: 'ceil' }; }
  }
  return null;
}
function touchingWall(b, dir) {
  const tx = Math.floor(dir > 0 ? (b.x + b.w + 1) / TS : (b.x - 1) / TS);
  const y0 = Math.floor((b.y + 6) / TS), y1 = Math.floor((b.y + b.h - 6) / TS);
  for (let ty = y0; ty <= y1; ty++) if (isSolid(tAt(tx, ty))) return true;
  return false;
}
function groundAhead(b, dir) {
  const tx = Math.floor(dir > 0 ? (b.x + b.w + 2) / TS : (b.x - 2) / TS);
  const ch = tAt(tx, Math.floor((b.y + b.h + 2) / TS));
  return isSolid(ch) || ch === '=' || ch === 'c';
}

function onLevelComplete() {

    sparkles: Math.max(prev.sparkles, res.sparkles), total: res.total, pudding: prev.pudding || res.pudding,

  Save.data.unlocked = Math.max(Save.data.unlocked, Math.min(LEVELS.length, i + 2));
  const un = G.def.unlock;

  Save.store();
  Game.clear = res; Game.clearSel = 0; Game.screen = 'clear'; Game.fadeIn = 0.6;

}

// ------------------------------------------------------------ main loop
function update(dt) {
  Game.t += dt;
  Game.fadeIn = Math.max(0, Game.fadeIn - dt * 3);
  if (pressed.music) setMusic(!Save.data.music);
  switch (Game.screen) {
    case 'title': updateTitle(dt); break;
    case 'howto': updateHowto(dt); break;
    case 'map': updateMap(dt); break;
    case 'dialog': updateDialog(dt); break;
    case 'play': updatePlay(dt); break;
    case 'clear': updateClear(dt); break;
    case 'credits': if (!Game.creditsT) Game.creditsT = Game.t; updateCredits(dt); break;
  }
  if (Game.screen !== 'credits') Game.creditsT = 0;
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.textBaseline = 'alphabetic';
  switch (Game.screen) {
    case 'boot': ctx.fillStyle = '#1b1030'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#ffe066'; ctx.font = font(22, 700); ctx.textAlign = 'center'; ctx.fillText('Snipping open a portal...', W / 2, H / 2); break;
    case 'title': drawTitle(ctx); break;
    case 'howto': drawHowto(ctx); break;
    case 'map': drawMap(ctx); break;
    case 'dialog': drawDialog(ctx); break;
    case 'play': drawPlay(ctx); break;
    case 'clear': drawClear(ctx); break;
    case 'credits': drawCredits(ctx); break;
  }
  if (Game.fadeIn > 0) { ctx.fillStyle = `rgba(15,8,30,${Game.fadeIn})`; ctx.fillRect(0, 0, W, H); }
}
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 6 && !window.__fluffFreeze) {
    try { update(STEP); } catch (err) { console.error(err); }
    clearPressed(); acc -= STEP; steps++;
  }
  if (steps >= 6) acc = 0;
  try { render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && Game.screen === 'play' && G && G.state === 'play' && !Game.koMenu) Game.paused = true;
});

// ------------------------------------------------------------ boot
function boot(data) {
  Save.load();
  resize();
  try {
    if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
      window.claude.hot.snapshot(() => ({ level: Game.screen === 'play' && G ? G.index : null }));
    }
  } catch (_) { }
  const fontsReady = (document.fonts && document.fonts.load)
    ? Promise.race([Promise.all([document.fonts.load('800 40px "Gluten"'), document.fonts.load('700 20px "Baloo 2"'), document.fonts.load('600 20px "Baloo 2"')]), new Promise(r => setTimeout(r, 2500))])
    : Promise.resolve();
  requestAnimationFrame(frame);
  fontsReady.catch(() => { }).then(() => {
    wrapCache.clear();
    if (data && typeof data.level === 'number' && LEVELS[data.level]) startLevel(data.level, false);

  });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});

})();
